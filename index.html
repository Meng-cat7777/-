<style>
/* Layout: a framed blush price sheet. Hairline side rails, small spaced labels top and bottom, rose section bars per series, soft light streaks behind. Single deliberate light look. */
:root{
  color-scheme:light;
  --blush:#F3E0E2; --blush-deep:#EAD0D4; --bar:#E9C9D0; --paper:#F8ECEE;
  --rail:#D9C3C7; --ink:#4A3440; --soft:#8C7680; --rose:#A3536A; --rose-deep:#7E3A50; --white:#FFFFFF;
  --f:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
*{box-sizing:border-box}
html{background:var(--blush)}
body{background:var(--blush);color:var(--ink);font-family:var(--f);font-weight:400;font-size:15px;line-height:1.85;min-height:100%;position:relative;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--rose);outline-offset:3px}

/* ambient light */
.light{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.light::before{content:"";position:absolute;width:42vmax;height:42vmax;right:-12vmax;top:4vh;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 62%)}
.light::after{content:"";position:absolute;width:36vmax;height:36vmax;left:-14vmax;bottom:-6vh;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,0) 60%)}
.streak{position:absolute;top:-20%;height:140%;width:9vmax;transform:rotate(18deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.42),rgba(255,255,255,0));animation:sweep 9s ease-in-out infinite}
.streak.s1{left:8%} .streak.s2{left:52%;width:4vmax;opacity:.7;animation-delay:-4s}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--white);box-shadow:0 0 10px 3px rgba(255,255,255,.9);animation:twinkle 4s ease-in-out infinite}
@keyframes sweep{0%,100%{translate:-6vw 0;opacity:.55}50%{translate:6vw 0;opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25;scale:.6}50%{opacity:1;scale:1}}
@media (prefers-reduced-motion:reduce){.streak,.spark{animation:none}}

/* frame */
.sheet{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-inline:16px}
.frame{border-inline:1px solid var(--rail);min-height:100vh;display:flex;flex-direction:column}
.bar-top,.bar-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;font-size:12px;letter-spacing:.24em;color:var(--soft)}
.bar-top{border-bottom:1px solid var(--rail)}
.bar-bottom{border-top:1px solid var(--rail);margin-top:auto}
.inner{padding-inline:clamp(16px,4vw,48px);padding-block:40px 48px}

.title{text-align:center}
.title h1{font-weight:500;font-size:clamp(30px,5.6vw,44px);letter-spacing:.18em;margin:0;text-wrap:balance;color:var(--ink)}
.title .rule{height:1px;background:var(--rail);margin:18px auto 10px;max-width:760px}
.title .eng{font-size:12px;letter-spacing:.6em;color:var(--soft);padding-left:.6em}
.title p{margin:18px auto 0;color:var(--soft);font-size:clamp(11px,3.3vw,15px);letter-spacing:.06em;white-space:nowrap}
.modes{display:flex;justify-content:center;margin:30px auto 0;border:1px solid var(--rail);border-radius:999px;width:max-content;max-width:100%;padding:3px;background:rgba(255,255,255,.35)}
.modes button{all:unset;cursor:pointer;padding:6px 22px;border-radius:999px;font-size:14px;letter-spacing:.2em;color:var(--soft)}
.modes button[aria-pressed="true"]{background:var(--rose);color:var(--white)}
.modes button:focus-visible{outline:1.5px solid var(--rose);outline-offset:2px}
.tools:empty{display:none}
.row b.slink{all:unset;cursor:pointer;font-weight:500;white-space:nowrap;border-bottom:1px dotted var(--rose);color:var(--rose-deep)}
.row b.slink:hover{color:var(--rose)}
.uses{display:flex;flex-wrap:wrap;gap:8px}
.uses button{all:unset;cursor:pointer;font-size:13px;letter-spacing:.08em;border:1px solid var(--rail);border-radius:999px;padding:2px 12px;background:rgba(255,255,255,.45)}
.uses button:hover{border-color:var(--rose);color:var(--rose)}
.kw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kw span{font-size:12px;letter-spacing:.1em;color:var(--rose);border:1px solid rgba(163,83,106,.35);border-radius:999px;padding:0 10px}

.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:30px 0 8px}
.pill{border:1px solid var(--rail);background:rgba(255,255,255,.35);border-radius:999px;padding:5px 18px;font-size:13px;letter-spacing:.14em;color:var(--soft)}
.pill:hover{border-color:var(--rose);color:var(--rose)}
.pill[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--white)}

.admin-note{margin:18px auto 0;max-width:760px;border:1px dashed var(--rose);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--rose-deep);background:rgba(255,255,255,.35);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

section.series{margin-top:40px}
.sec-bar{background:linear-gradient(90deg,var(--bar),#EFD5DA 50%,var(--bar));border-radius:6px;text-align:center;padding:9px 12px;font-size:19px;letter-spacing:.32em;color:var(--rose);font-weight:500}
.sec-bar small{display:block;font-size:11px;letter-spacing:.3em;color:var(--soft);font-weight:400;margin-top:-2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:20px}

.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:rgba(255,255,255,.38);border:1px solid rgba(217,195,199,.8);border-radius:4px;overflow:hidden;transition:background .2s,border-color .2s,translate .2s}
.card:hover{background:rgba(255,255,255,.62);border-color:var(--rose);translate:0 -2px}
.card:focus-visible{outline:1.5px solid var(--rose);outline-offset:3px}
.pic{display:block;width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--paper)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.code{font-size:12px;letter-spacing:.26em;color:var(--rose)}
.theme{font-size:16px;font-weight:500;line-height:1.5;color:var(--ink)}
.stones{font-size:13px;color:var(--soft);line-height:1.6}
.foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--rail);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.beads{font-size:12px;color:var(--soft);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.price{font-size:19px;color:var(--rose);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.price::before{content:"NT$ ";font-size:11px;letter-spacing:.1em;color:var(--soft)}
.edit{all:unset;cursor:pointer;font-size:12px;letter-spacing:.14em;color:var(--white);background:var(--rose);border-radius:999px;padding:1px 12px}

.empty{margin-top:40px;text-align:center;color:var(--soft);padding:48px 16px;border:1px dashed var(--rail);border-radius:6px;letter-spacing:.06em}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:19px;letter-spacing:.14em;margin-bottom:6px}
.closing{text-align:center;margin-top:44px;color:var(--ink);letter-spacing:.12em;font-size:14px}

.btn{border:1px solid var(--rail);background:rgba(255,255,255,.5);border-radius:999px;padding:7px 18px;font-size:13px;letter-spacing:.14em;color:var(--ink)}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--white)}
.btn.on{border-color:var(--rose);color:var(--rose)}
.btn.danger{border-color:#A33B3B;color:#A33B3B;background:transparent}
.btn.danger.armed{background:#A33B3B;color:var(--white)}
.linkish{all:unset;cursor:pointer;letter-spacing:.24em}
.linkish:hover{color:var(--rose)}

/* dialogs */
dialog{border:1px solid var(--rail);padding:0;background:var(--blush);color:var(--ink);border-radius:6px;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(74,52,64,.42)}
.d-top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rail);font-size:12px;letter-spacing:.24em;color:var(--soft)}
.x{all:unset;cursor:pointer;font-size:20px;line-height:1;color:var(--soft);padding:2px 6px}
.d-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.d-grid .pic{height:100%;aspect-ratio:auto;min-height:300px;border-right:1px solid var(--rail)}
.d-body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.d-body h2{margin:0;text-align:center;font-weight:500;font-size:24px;letter-spacing:.14em;line-height:1.5;text-wrap:balance}
.d-body .eng{text-align:center;font-size:11px;letter-spacing:.5em;color:var(--soft);margin-top:-8px}
.d-sec{background:linear-gradient(90deg,var(--bar),#EFD5DA 50%,var(--bar));border-radius:5px;text-align:center;padding:4px;font-size:14px;letter-spacing:.3em;color:var(--rose)}
.row{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:3px 2px}
.row b{font-weight:500;white-space:nowrap}
.row span{color:var(--soft);text-align:right}
.d-text{font-size:14px;margin:0;padding:0 2px}
.story{font-size:15px;line-height:2;margin:0;padding:12px 2px 0;border-top:1px solid var(--rail)}
.d-price{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rail);padding-top:12px}
.d-price .price{font-size:26px}
@media (max-width:620px){.d-grid{grid-template-columns:1fr}.d-grid .pic{min-height:0;aspect-ratio:4/3;border-right:none;border-bottom:1px solid var(--rail)}}

form.editor{padding:20px 22px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;letter-spacing:.14em;color:var(--soft)}
.field input,.field select,.field textarea{border:1px solid var(--rail);border-radius:6px;padding:7px 10px;background:rgba(255,255,255,.6);width:100%}
.field textarea{min-height:84px;resize:vertical;line-height:1.7}
.hint{font-size:12px;color:var(--soft)}
.photo{display:flex;gap:12px;align-items:center;min-width:0}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:4px;flex:none;border:1px solid var(--rail)}
.photo input{min-width:0}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--rail);padding-top:14px}
.status{font-size:13px;color:var(--soft)} .status.err{color:#A33B3B}
@media (max-width:560px){form.editor{grid-template-columns:1fr}}

/* ---- accents & borders: each series / chakra carries its own color ---- */
:root{--paper2:#FFF9FA;--line-strong:#C9A3AE;--gold:#B08D57;--plum:#5A2E44;--acc:#B04E68;--acc-soft:#F6DDE3}
.frame{border-inline:3px double var(--line-strong)}
.bar-top,.bar-bottom{border-color:var(--line-strong)!important;color:var(--plum)}
.title h1{color:var(--plum)}
.title .rule{background:linear-gradient(90deg,transparent,var(--gold) 15%,var(--gold) 85%,transparent);position:relative;overflow:visible}
.title .rule::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--blush);border:1px solid var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.modes{border-color:var(--line-strong);background:var(--paper2)}
.modes button[aria-pressed="true"]{background:var(--plum)}
.pill{background:var(--paper2);border-color:var(--line-strong);color:var(--plum)}
.pill:hover{border-color:var(--acc);color:var(--acc)}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--white)}
.pill.all[aria-pressed="true"]{background:var(--plum);border-color:var(--plum)}
.sec-bar{background:var(--acc);color:var(--white);border-radius:3px;box-shadow:0 0 0 3px var(--blush),0 0 0 4px var(--acc);margin-inline:4px;display:flex;justify-content:center;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec-bar small{display:inline;color:rgba(255,255,255,.85);margin:0;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:0 10px;letter-spacing:.2em}
.grid{gap:20px;margin-top:24px}
.card{background:var(--paper2);border:1px solid var(--line-strong);border-top:4px solid var(--acc);padding:8px;border-radius:4px}
.card:hover{background:var(--white);border-color:var(--acc);box-shadow:0 10px 22px -14px var(--acc)}
.card .pic{border:1px solid var(--acc-soft);border-radius:2px}
.cbody{padding:12px 6px 4px}
.code{align-self:flex-start;background:var(--acc);color:var(--white);padding:0 10px;border-radius:2px;letter-spacing:.2em;font-size:12px}
.theme{color:var(--plum)}
.stones{color:#7A6470}
.foot{border-top:1px dashed var(--line-strong)}
.price{color:var(--acc);font-weight:500}
.edit{background:var(--acc)}
.closing{display:inline-block;position:relative;left:50%;translate:-50% 0;border:1px solid var(--line-strong);border-radius:999px;padding:4px 22px;background:var(--paper2);color:var(--plum)}
dialog{background:var(--paper2);border:1px solid var(--line-strong);border-top:5px solid var(--acc)}
.d-top{background:var(--acc-soft);color:var(--plum);border-color:var(--line-strong)}
.d-top>span:last-child{color:var(--acc);font-weight:500}
.d-body h2{color:var(--plum)}
.d-sec{background:var(--acc-soft);color:var(--acc);border-left:3px solid var(--acc);border-radius:2px;text-align:left;padding:3px 12px;font-weight:500}
.row{border-bottom:1px dotted var(--line-strong);padding:5px 2px}
.row b.slink{color:var(--acc);border-bottom-color:var(--acc)}
.kw span{color:var(--acc);border-color:var(--acc)}
.uses button{border-color:var(--acc);color:var(--acc);background:var(--white)}
.uses button:hover{background:var(--acc);color:var(--white)}
.d-price{border-top:1px solid var(--line-strong)}
.d-price .price{border:1px solid var(--acc);border-radius:3px;padding:0 14px}
.btn.primary{background:var(--plum);border-color:var(--plum)}
.admin-note{border-color:var(--plum);color:var(--plum);background:var(--paper2)}

.quiz{margin:28px auto 0;max-width:560px;border:1px solid var(--line-strong);outline:1px solid var(--line-strong);outline-offset:4px;border-radius:4px;background:var(--paper2);padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.quiz small{display:block;font-size:11px;letter-spacing:.32em;color:var(--gold)}
.quiz b{display:block;font-weight:500;font-size:17px;letter-spacing:.1em;color:var(--plum)}
.quiz a,.quiz-end a{display:inline-flex;align-items:center;gap:8px;background:var(--plum);color:var(--white);text-decoration:none;border-radius:999px;padding:8px 22px;font-size:14px;letter-spacing:.16em;white-space:nowrap;transition:background .2s}
.quiz a:hover,.quiz-end a:hover{background:var(--acc)}
.quiz a::after,.quiz-end a::after{content:"→";letter-spacing:0}
.quiz-end{text-align:center;margin-top:18px;font-size:13px;color:var(--soft);letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (max-width:480px){.quiz{justify-content:center;text-align:center}}
.quiz>div{flex:1 1 260px;min-width:0}
.quiz-desc{display:block;margin-top:4px;font-size:13px;line-height:1.7;color:#7A6470;letter-spacing:.04em}

.bar-bottom{position:relative;justify-content:center;text-align:center}
.foot-text{letter-spacing:.2em}
.admin-link{position:absolute;right:22px;top:50%;translate:0 -50%;font-size:11px;opacity:.7}
.admin-link:hover{opacity:1}
@media (max-width:480px){.bar-bottom{flex-direction:column;gap:6px}.admin-link{position:static;translate:none}}
.d-body em{font-style:normal}
.hl-stone{color:var(--acc);font-weight:600;border-bottom:1px solid var(--acc)}
.hl-key{color:var(--plum);font-weight:600;background:linear-gradient(transparent 58%,var(--acc-soft) 58%);padding:0 1px}
.hl-chakra{color:var(--acc);font-weight:600}
.hl-num{display:inline-block;min-width:1.6em;text-align:center;color:var(--white);background:var(--acc);border-radius:3px;padding:0 5px;margin:0 2px;font-weight:500;line-height:1.5;font-variant-numeric:tabular-nums}
.story::first-letter{font-size:1.5em;color:var(--acc);font-weight:600}
form.pw{grid-template-columns:1fr}

/* line breaks typed in the back office show on the front page */
.story,.d-text,.row span,.quiz-desc{white-space:pre-line}
/* back office page */
.adm-links{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.adm-links a{color:inherit;text-decoration:none}
.adm-title h1{font-size:clamp(24px,4.4vw,34px)}
.gate{max-width:420px;margin:36px auto 0;background:var(--paper2);border:1px solid var(--line-strong);outline:1px solid var(--line-strong);outline-offset:5px;border-radius:4px;padding:26px 24px;display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0;text-align:center;font-weight:500;font-size:20px;letter-spacing:.2em;color:var(--plum)}
.gate .hint{text-align:center;margin:0}
.gate form{display:flex;flex-direction:column;gap:12px}
.gate-actions{display:flex;gap:10px;justify-content:flex-end}
.adm-lead{text-align:center;color:var(--soft);font-size:14px;margin:26px 0 0}
.adm-tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:26px 0 6px}
.adm-tools input{flex:1 1 240px;min-width:0;border:1px solid var(--line-strong);border-radius:999px;padding:7px 16px;background:var(--paper2)}
.adm-group{margin-top:26px}
.adm-group .sec-bar{font-size:16px;padding:6px 12px}
.adm-rows{margin-top:14px;border:1px solid var(--line-strong);border-radius:4px;background:var(--paper2);overflow:hidden}
.adm-row{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rail);border-left:4px solid var(--acc)}
.adm-row:last-child{border-bottom:none}
.adm-row:hover{background:var(--white)}
.adm-row:focus-visible{outline:1.5px solid var(--acc);outline-offset:-3px}
.adm-row img{width:56px;height:56px;object-fit:cover;border-radius:3px;border:1px solid var(--acc-soft)}
.r-main{min-width:0;display:flex;flex-direction:column}
.r-main b{font-weight:500;color:var(--plum);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-main small{color:var(--soft);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-main .code{margin-bottom:2px}
.r-price{color:var(--acc);font-variant-numeric:tabular-nums;font-weight:500}

<script>
const COL="bracelets",SCOL="stones";
const STONE={"番石榴石":"#C6806A","翡翠":"#7FAE86","紫鋰輝":"#CDA8CF","阿魯沙":"#D9975C","藍月光石":"#C9D5E6","沙佛萊":"#3F9160","白水晶":"#F4F4F6","青金石":"#304C8E","彩幽靈":"#A3B58F","藍磷輝石":"#5FAEBB","極光":"#B9A7DC","薔薇輝石":"#D98C9C","黑金超":"#2E262C","藍兔毛":"#93BBD9","海藍寶":"#AFD8E2","堇青石":"#5C61A2","坦桑石":"#5D51A4","藍摩根石":"#BCD0E3","天河石":"#82C4B6","藍方解石":"#A2C8E3","藍晶石":"#527CAB","紫水晶":"#8E6BB8","紫雲母":"#AB8DBB","薰衣草紫水晶":"#C6B3DC"};
const ACC={A:["#B04E68","#F6DDE3"],B:["#3F6F94","#DCE8F1"],C:["#7A5BA6","#E9E1F3"],
 "海底輪":["#A8453F","#F4DEDB"],"臍輪":["#B5602C","#F6E2D4"],"太陽神經叢":["#94701E","#F3EAD2"],"心輪":["#4A7F57","#DDEBDF"],
 "喉輪":["#3F7896","#DAE9F1"],"眉心輪":["#4A5698","#E0E3F2"],"頂輪":["#7A5BA6","#E9E1F3"]};
const CHK=["海底輪","臍輪","太陽神經叢","心輪","喉輪","眉心輪","頂輪"];
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const themeWords=it=>String(it.theme||"").split(/[\/／、]/).map(w=>w.trim()).filter(w=>w.length>=2);
const termsFor=it=>[...(it.stones||[]).map(s=>s.name),...CHK,...themeWords(it)];
function hl(text,terms){
  let out=esc(text);const t=[...new Set(terms.filter(Boolean))].sort((a,b)=>b.length-a.length);
  if(!t.length)return out;
  const stones=new Set(S.stones.map(x=>x.name).concat(Object.keys(STONE)));
  return out.replace(new RegExp(t.map(w=>reEsc(esc(w))).join("|"),"g"),m=>`<em class="${stones.has(m)?"hl-stone":CHK.includes(m)?"hl-chakra":"hl-key"}">${m}</em>`);
}
const hlNum=text=>esc(text).replace(/(雙\s?\d+|三個\s?\d+|\d+)/g,'<em class="hl-num">$1</em>');
const accStyle=k=>{const a=ACC[k]||ACC.A;return `--acc:${a[0]};--acc-soft:${a[1]}`};
const S={mode:"bracelets",items:[],stones:[],filter:"全部",editor:false,admin:false,db:null,assets:null,editing:null,newFile:null,sEditing:null,sFile:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-US");
const stoneByName=n=>S.stones.find(s=>s.name===n);
const colorOf=n=>stoneByName(n)?.color||STONE[n]||"#D8B4BC";
const usesOf=n=>S.items.filter(i=>(i.stones||[]).some(s=>s.name===n));

/* illustrations */
function bracelet(stones){
  const cols=(stones||[]).map(s=>colorOf(s.name));if(!cols.length)cols.push("#D8B4BC");
  const n=20,R=62,cx=100,cy=100;let beads="";
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),c=cols[i%cols.length];
    beads+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10.2" fill="${c}" stroke="#fff" stroke-opacity=".6" stroke-width=".8"/><circle cx="${(x-3).toFixed(1)}" cy="${(y-3.4).toFixed(1)}" r="3" fill="#fff" fill-opacity=".55"/>`}
  return svgURI(`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#D9C3C7" stroke-width="1"/>${beads}`);
}
function bead(color){
  const c=/^#[0-9a-f]{6}$/i.test(color||"")?color:"#D8B4BC";
  return svgURI(`<ellipse cx="100" cy="166" rx="44" ry="7" fill="#C9A9B0" fill-opacity=".35"/><circle cx="100" cy="100" r="56" fill="${c}" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/><circle cx="100" cy="100" r="56" fill="url(#s)"/><ellipse cx="80" cy="76" rx="17" ry="11" fill="#fff" fill-opacity=".6" transform="rotate(-30 80 76)"/>`,
    `<radialGradient id="s" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient>`);
}
function svgURI(body,defs=""){
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><radialGradient id="g" cx=".7" cy=".25" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F3E0E2"/></radialGradient>${defs}</defs><rect width="200" height="200" fill="url(#g)"/>${body}</svg>`);
}
const pic=it=>it.image?it.image:bracelet(it.stones);
const spic=st=>st.image?st.image:bead(st.color);
document.addEventListener("error",e=>{const el=e.target;if(el.tagName!=="IMG"||el.dataset.f)return;el.dataset.f=1;
  if(el.dataset.id){const it=S.items.find(i=>i.id===el.dataset.id);el.src=bracelet(it?.stones)}
  else if(el.dataset.sid){const st=S.stones.find(i=>i.id===el.dataset.sid);el.src=bead(st?.color)}},true);

/* ---------- render ---------- */
function seriesOf(){return [...new Set(S.items.map(i=>i.series||"其他"))].sort()}
const CHAKRAS=["海底輪","臍輪","太陽神經叢","心輪","喉輪","眉心輪","頂輪"];
function chakrasOf(){return CHAKRAS.filter(c=>S.stones.some(s=>s.chakra===c))}
const designOn=()=>S.cfg?.enabled!==false;
function renderFilters(){
  const dBtn=document.querySelector('#modes [data-m="design"]');if(dBtn)dBtn.hidden=!designOn();
  if(S.mode==="design"&&!designOn())S.mode="bracelets";
  if(S.mode==="design"){$("filters").innerHTML="";document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===S.mode));$("closing").textContent="想要現成的搭配？也可以回到「能量手串」看看";return}
  const isB=S.mode==="bracelets";
  const vals=isB?seriesOf():chakrasOf();const opts=["全部",...vals];if(!opts.includes(S.filter))S.filter="全部";
  const has=isB?S.items.length:S.stones.length;
  $("filters").innerHTML=has?opts.map(o=>`<button class="pill${o==="全部"?" all":""}" style="${o==="全部"?"":accStyle(o)}" aria-pressed="${o===S.filter}" data-f="${esc(o)}">${o==="全部"||!isB?esc(o):esc(o)+" 系列"}</button>`).join(""):"";
  
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===S.mode));
  $("closing").textContent=isB?"點選手串，查看完整水晶組成與能量說明":"點選水晶，查看單顆說明與搭配的手串";
}
function card(it){
  return `<button class="card" data-id="${esc(it.id)}">
    <img class="pic" src="${pic(it)}" data-id="${esc(it.id)}" alt="${esc(it.code)} 手串照片" loading="lazy">
    <div class="cbody">
      <span class="code">${esc(it.code)}</span>
      <span class="theme">${esc(it.theme)}</span>
      <span class="stones">${(it.stones||[]).map(s=>esc(s.name)).join("・")}</span>
      <span class="foot"><span class="beads">${esc(it.beads)}</span>
        ${S.admin?`<span class="edit" data-edit="${esc(it.id)}">編輯</span>`:`<span class="price">${fmt(it.price)}</span>`}</span>
    </div></button>`;
}
function scard(st){
  const n=usesOf(st.name).length;
  return `<button class="card" data-sid="${esc(st.id)}">
    <img class="pic" src="${spic(st)}" data-sid="${esc(st.id)}" alt="${esc(st.name)}照片" loading="lazy">
    <div class="cbody">
      <span class="code">${esc(st.en||st.chakra||"")}</span>
      <span class="theme">${esc(st.name)}</span>
      <span class="stones">${(st.keywords||[]).map(esc).join("・")}</span>
      <span class="foot"><span class="beads">${esc(st.chakra||"")}</span>
        ${S.admin?`<span class="edit" data-sedit="${esc(st.id)}">編輯</span>`:`<span class="beads">${n?"搭配 "+n+" 款手串":""}</span>`}</span>
    </div></button>`;
}
function renderList(msg){
  const L=$("list");
  if(msg){L.innerHTML=`<div class="empty"><b>${esc(msg[0])}</b>${esc(msg[1])}</div>`;return}
  if(S.mode==="design"){renderDesign();return}
  if(S.mode==="bracelets"){
    if(!S.items.length){L.innerHTML=`<div class="empty"><b>手串整理中</b>${S.editor?"打開下方「後台」，按「新增手串」放上第一款。":"新的手串即將上架，晚點再回來看看。"}</div>`;return}
    const groups=seriesOf().filter(s=>S.filter==="全部"||s===S.filter);
    L.innerHTML=groups.map(s=>{const list=S.items.filter(i=>(i.series||"其他")===s);
      return `<section class="series" style="${accStyle(s)}"><div class="sec-bar">${esc(s)} 系列<small>${list.length} 款</small></div><div class="grid">${list.map(card).join("")}</div></section>`}).join("");
  }else{
    if(!S.stones.length){L.innerHTML=`<div class="empty"><b>水晶說明整理中</b>${S.editor?"打開下方「後台」，按「新增水晶」寫下第一顆的說明。":"單顆水晶說明即將上線。"}</div>`;return}
    const groups=chakrasOf().filter(c=>S.filter==="全部"||c===S.filter);
    L.innerHTML=groups.map(c=>{const list=S.stones.filter(s=>s.chakra===c);
      return `<section class="series" style="${accStyle(c)}"><div class="sec-bar">${esc(c)}<small>${list.length} 種</small></div><div class="grid">${list.map(scard).join("")}</div></section>`}).join("");
  }
}
function render(){renderFilters();renderList()}

$("modes").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b||b.dataset.m===S.mode)return;S.mode=b.dataset.m;S.filter="全部";render()});
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){S.filter=b.dataset.f;render()}});
$("list").addEventListener("click",e=>{
  const c=e.target.closest(".card");if(!c)return;
  if(c.dataset.id)openDetail(c.dataset.id);
  else openStone(c.dataset.sid);
});

/* ---------- detail views ---------- */
function show(html){
  const d=$("detail");d.innerHTML=html;d.querySelector(".x").onclick=()=>d.close();
  d.querySelectorAll("[data-goto-stone]").forEach(b=>b.onclick=()=>openStone(b.dataset.gotoStone));
  d.querySelectorAll("[data-goto-b]").forEach(b=>b.onclick=()=>openDetail(b.dataset.gotoB));
  if(!d.open)d.showModal();d.scrollTop=0;
}
function openDetail(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  $("detail").style.cssText=accStyle(it.series);
  show(`
    <div class="d-top"><span>${esc(it.series||"")} 系列</span><span style="display:flex;gap:14px;align-items:center">${esc(it.code)}<button class="x" aria-label="關閉">×</button></span></div>
    <div class="d-grid">
      <img class="pic" src="${pic(it)}" data-id="${esc(it.id)}" alt="${esc(it.code)} 手串照片">
      <div class="d-body">
        <h2>${esc(it.theme)}</h2><div class="eng">${esc(it.beads)}</div>
        <div class="d-sec">水晶組成</div>
        <div class="stone-list">${(it.stones||[]).map(s=>{const st=stoneByName(s.name),c=colorOf(s.name);
          const chips=String(s.meaning||"").split(/[，,、；;]/).map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip">${hl(x,themeWords(it))}</span>`).join("");
          const head=`<span class="dot" style="background:${esc(c)}"></span><b>${esc(s.name)}</b>${st?`<span class="more">看說明</span>`:""}`;
          return st?`<div class="stone-item" style="--sc:${esc(c)}" role="button" tabindex="0" data-goto-stone="${esc(st.id)}"><div class="si-head">${head}</div><div class="chips">${chips}</div></div>`
                   :`<div class="stone-item" style="--sc:${esc(c)}"><div class="si-head">${head}</div><div class="chips">${chips}</div></div>`}).join("")}</div>
        ${it.numerology?`<div class="d-sec">數字能量</div><p class="d-text d-box">${hlNum(it.numerology)}</p>`:""}
        ${it.chakra?`<div class="d-sec">對應脈輪</div><p class="d-text d-box">${hl(it.chakra,termsFor(it))}</p>`:""}
        ${it.story?`<p class="story">${hl(it.story,termsFor(it))}</p>`:""}
        <div class="d-price"><span class="beads">售價</span><span class="price">${fmt(it.price)}</span></div>
      </div>
    </div>`);
}
function openStone(sid){
  const st=S.stones.find(s=>s.id===sid);if(!st)return;
  const uses=usesOf(st.name);$("detail").style.cssText=accStyle(st.chakra);
  const paras=String(st.desc||"").split(/\n+/).filter(Boolean).map(p=>`<p class="d-text">${esc(p)}</p>`).join("");
  show(`
    <div class="d-top"><span>單顆水晶</span><span style="display:flex;gap:14px;align-items:center">${esc(st.chakra||"")}<button class="x" aria-label="關閉">×</button></span></div>
    <div class="d-grid">
      <img class="pic" src="${spic(st)}" data-sid="${esc(st.id)}" alt="${esc(st.name)}照片">
      <div class="d-body">
        <h2>${esc(st.name)}</h2>${st.en?`<div class="eng">${esc(st.en)}</div>`:""}
        ${(st.keywords||[]).length?`<div class="kw">${st.keywords.map(k=>`<span>${esc(k)}</span>`).join("")}</div>`:""}
        <div class="d-sec">水晶說明</div>
        ${paras||`<p class="d-text">說明撰寫中。</p>`}
        ${st.care?`<div class="d-sec">保養方式</div><p class="d-text">${esc(st.care)}</p>`:""}
        ${uses.length?`<div class="d-sec">搭配的手串</div><div class="uses">${uses.map(u=>`<button style="${accStyle(u.series)}" data-goto-b="${esc(u.id)}">${esc(u.code)}・${esc(String(u.theme||"").split("/")[0].trim())}</button>`).join("")}</div>`:""}
      </div>
    </div>`);
}
$("detail").addEventListener("click",e=>{if(e.target===$("detail"))$("detail").close()});
$("detail").addEventListener("keydown",e=>{const b=e.target.closest("[data-goto-stone]");if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openStone(b.dataset.gotoStone)}});

/* ---------- 自行設計 designer ---------- */
const sizesCfg=()=>{const z=(S.cfg?.sizes||[6,8,10,12]).map(Number).filter(n=>n>0);return z.length?z:[6,8,10,12]};
const priceOf=(name,size)=>{const v=stoneByName(name)?.prices?.[String(size)];return typeof v==="number"&&v>=0?v:null};
const D={wrist:15,beads:[],active:null,size:8};
try{const sv=JSON.parse(localStorage.getItem("aira-design")||"null");if(sv&&Array.isArray(sv.beads)){D.wrist=sv.wrist||15;D.beads=sv.beads.slice(0,80);D.size=sv.size||8}}catch(_){}
const saveD=()=>{try{localStorage.setItem("aira-design",JSON.stringify({wrist:D.wrist,beads:D.beads,size:D.size}))}catch(_){}};
const targetMM=()=>Math.round((D.wrist+1.5)*10);
const lenMM=()=>D.beads.reduce((a,b)=>a+b.size,0);

function ringSVG(){
  const L=lenMM(),T=targetMM(),C=Math.max(L,T),R=C/(2*Math.PI),k=72/R;
  let g=`<circle cx="100" cy="100" r="${(T/(2*Math.PI)*k).toFixed(1)}" fill="none" stroke="#C9A3AE" stroke-width="1" stroke-dasharray="3 4"/>`;
  let cum=0;
  D.beads.forEach(b=>{const a=(cum+b.size/2)/C*2*Math.PI-Math.PI/2;cum+=b.size;
    const x=100+72*Math.cos(a),y=100+72*Math.sin(a),r=Math.max(2.5,b.size/2*k*.96),c=colorOf(b.name);
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}" stroke="#fff" stroke-opacity=".7" stroke-width=".8"/><circle cx="${(x-r*.3).toFixed(1)}" cy="${(y-r*.34).toFixed(1)}" r="${(r*.3).toFixed(1)}" fill="#fff" fill-opacity=".55"/>`});
  const msg=D.beads.length?`${(L/10).toFixed(1)} cm`:"從右邊挑選水晶";
  return `<svg viewBox="0 0 200 200" role="img" aria-label="手串預覽"><defs><radialGradient id="dg" cx=".7" cy=".25" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F8ECEE"/></radialGradient></defs><rect width="200" height="200" fill="url(#dg)"/>${g}<text x="100" y="98" text-anchor="middle" font-size="${D.beads.length?15:10}" fill="#5A2E44" font-family="Noto Serif TC,serif">${msg}</text>${D.beads.length?`<text x="100" y="116" text-anchor="middle" font-size="8.5" fill="#8C7680" letter-spacing="1">${D.beads.length} 顆</text>`:""}</svg>`;
}
function renderDesign(){
  const L=$("list"),sizes=sizesCfg(),stones=S.stones;
  if(!stones.length){L.innerHTML=`<div class="empty"><b>水晶準備中</b>可搭配的水晶即將上線。</div>`;return}
  if(D.active&&!stoneByName(D.active))D.active=null;
  const act=D.active,len=lenMM(),T=targetMM(),diff=T-len;
  const pct=Math.min(100,Math.round(len/T*100));
  const status=!D.beads.length?"還沒有加入水晶":Math.abs(diff)<=4?"長度剛剛好":diff>0?`還差約 ${(diff/10).toFixed(1)} cm，大約 ${Math.max(1,Math.round(diff/D.size))} 顆 ${D.size}mm`:`超過建議長度 ${(-diff/10).toFixed(1)} cm`;
  // summary
  const groups={};D.beads.forEach(b=>{const k=b.name+"|"+b.size;groups[k]=(groups[k]||0)+1});
  let sub=0,unpriced=false;
  const rows=Object.entries(groups).map(([k,n])=>{const [name,size]=k.split("|"),p=priceOf(name,size);if(p==null)unpriced=true;else sub+=p*n;
    return `<div class="sum-row" style="--sc:${esc(colorOf(name))}"><span class="dot"></span><b>${esc(name)}</b><span class="mm">${size}mm × ${n}</span><span class="amt">${p==null?"待確認":"NT$ "+fmt(p*n)}</span></div>`}).join("");
  const labor=Number(S.cfg?.labor)||0,total=sub+(D.beads.length?labor:0);
  L.innerHTML=`<section class="designer" style="${accStyle("A")}">
    <div class="dz-head"><div class="sec-bar">自行設計<small>DIY</small></div>
      <p>依照你的需求與喜好挑選水晶與尺寸，一顆一顆串出屬於你的頻率，下方會即時試算價格。</p></div>
    <div class="dz-grid">
      <div class="dz-preview">
        <div class="ring">${ringSVG()}</div>
        <div class="meter"><div class="bar"><i style="width:${pct}%"></i></div><span>${esc(status)}</span></div>
        <div class="wrist"><label for="d-wrist">手圍</label>
          <select id="d-wrist">${[13,13.5,14,14.5,15,15.5,16,16.5,17,17.5,18,18.5,19].map(w=>`<option value="${w}"${w===D.wrist?" selected":""}>${w} cm</option>`).join("")}</select>
          <span class="hint">建議成品長度 ${(T/10).toFixed(1)} cm</span></div>
        <div class="dz-actions">
          <button class="btn" data-d="undo"${D.beads.length?"":" disabled"}><span class="d-only">移除最後一顆</span><span class="m-only">移除一顆</span></button>
          <button class="btn" data-d="fill"${D.beads.length||act?"":" disabled"}><span class="d-only">依目前排列填滿</span><span class="m-only">自動填滿</span></button>
          <button class="btn" data-d="clear"${D.beads.length?"":" disabled"}>清空</button>
        </div>
      </div>
      <div class="dz-pick">
        <div class="step"><span class="no">1</span>挑選水晶<span class="m-only swipe">左右滑動看更多 ›</span></div>
        <div class="palette">${stones.map(st=>`<button class="swatch${st.name===act?" on":""}" style="--sc:${esc(st.color||colorOf(st.name))};${accStyle(st.chakra)}" data-pick="${esc(st.name)}" aria-pressed="${st.name===act}"><span class="dot"></span><span>${esc(st.name)}</span></button>`).join("")}</div>
        ${act?`<div class="picked" style="${accStyle(stoneByName(act)?.chakra)}"><b>${esc(act)}</b>${(stoneByName(act)?.keywords||[]).slice(0,3).map(k=>`<span class="chip">${esc(k)}</span>`).join("")}<button class="more" data-goto-s="${esc(stoneByName(act)?.id||"")}">看說明</button></div>`:""}
        <div class="step"><span class="no">2</span>選擇尺寸</div>
        <div class="sizes">${sizes.map(z=>{const p=act?priceOf(act,z):null;return `<button class="size${z===D.size?" on":""}" data-size="${z}" aria-pressed="${z===D.size}"><b>${z}mm</b><small>${act?(p==null?"待確認":"NT$ "+fmt(p)+"<span class=\"d-only\"> / 顆</span>"):"每顆價格"}</small></button>`}).join("")}</div>
        <div class="step"><span class="no">3</span>加入手串</div>
        <div class="add-row"><button class="btn primary" data-d="add"${act?"":" disabled"}>加入 1 顆</button><button class="btn" data-d="add3"${act?"":" disabled"}>加入 3 顆</button></div>
      </div>
    </div>
    <div class="estimate">
      <div class="est-head">價格試算</div>
      ${D.beads.length?`<div class="sum-list">${rows}</div>
        <div class="est-line"><span>水晶小計</span><span>NT$ ${fmt(sub)}${unpriced?"＋待確認":""}</span></div>
        ${labor?`<div class="est-line"><span>手工串製</span><span>NT$ ${fmt(labor)}</span></div>`:""}
        <div class="est-total"><span>試算總價</span><span class="price">${fmt(total)}${unpriced?"<small>起</small>":""}</span></div>
        <p class="est-note">${unpriced?"部分水晶尚未定價，實際價格由 Aira 確認後提供。":esc(S.cfg?.note||"試算僅供參考，實際價格依水晶批次與尺寸，由 Aira 確認後提供。")}</p>
        <div class="est-cta"><button class="btn primary" data-d="copy">複製我的設計清單</button><span class="hint" id="copyHint">把清單傳給 Aira，就能幫你確認細節。</span></div>`
      :`<p class="est-note" style="text-align:center">加入水晶後，這裡會列出每顆水晶的數量與價格。</p>`}
    </div>
  </section>`;
}
function designText(){
  const groups={};D.beads.forEach(b=>{const k=b.name+" "+b.size+"mm";groups[k]=(groups[k]||0)+1});
  const seq=D.beads.map(b=>b.name+b.size).join("、");
  return `【我的手串設計】\n手圍：${D.wrist} cm，成品約 ${(lenMM()/10).toFixed(1)} cm，共 ${D.beads.length} 顆\n`+
    Object.entries(groups).map(([k,n])=>`・${k} × ${n}`).join("\n")+`\n排列：${seq}\n試算總價：NT$ ${$("list").querySelector(".est-total .price")?.textContent||""}`;
}
function addBeads(n){if(!D.active)return;for(let i=0;i<n&&D.beads.length<80;i++)D.beads.push({name:D.active,size:D.size});saveD();renderDesign()}
$("list").addEventListener("click",async e=>{
  if(S.mode!=="design")return;
  const pk=e.target.closest("[data-pick]");if(pk){D.active=pk.dataset.pick;const z=sizesCfg();if(!z.includes(D.size))D.size=z[0];renderDesign();return}
  const sz=e.target.closest("[data-size]");if(sz){D.size=Number(sz.dataset.size);saveD();renderDesign();return}
  const gs=e.target.closest("[data-goto-s]");if(gs&&gs.dataset.gotoS){openStone(gs.dataset.gotoS);return}
  const b=e.target.closest("[data-d]");if(!b)return;
  const a=b.dataset.d;
  if(a==="add")addBeads(1);
  else if(a==="add3")addBeads(3);
  else if(a==="undo"){D.beads.pop();saveD();renderDesign()}
  else if(a==="clear"){D.beads=[];saveD();renderDesign()}
  else if(a==="fill"){
    const pat=D.beads.length?D.beads.slice():[{name:D.active,size:D.size}];const T=targetMM();let i=0;
    while(lenMM()+pat[i%pat.length].size/2<=T&&D.beads.length<80){D.beads.push({...pat[i%pat.length]});i++}
    saveD();renderDesign();
  }else if(a==="copy"){
    const t=designText();
    try{await navigator.clipboard.writeText(t);toast("已複製設計清單")}
    catch(_){const h=$("copyHint");if(h){h.textContent="無法自動複製，請長按下方文字複製：";const pre=document.createElement("pre");pre.className="copy-pre";pre.textContent=t;h.after(pre)}}
  }
});
$("list").addEventListener("change",e=>{if(e.target.id==="d-wrist"){D.wrist=Number(e.target.value);saveD();renderDesign()}});


let toastT;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---------- boot ---------- */
(function(){
  let data={};
  try{data=JSON.parse(document.getElementById("shop-data").textContent||"{}")}catch(_){}
  const byOrder=(a,b)=>(a.order||0)-(b.order||0);
  S.items=(data.bracelets||[]).slice().sort(byOrder);
  S.stones=(data.stones||[]).slice().sort(byOrder);
  S.cfg=data.settings||{};
  render();
})();
