<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>喵帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F0;--ink:#4A3428;--sub:#7A6252;--sub2:#6B5240;--brand:#A9522B;--brand-d:#7E3B1E;
  --fam:#2F6472;--fam-l:#5E9AA8;--card:#FFFFFF;
  --peach:#FBE3D3;--butter:#FCEFC7;--sky:#DCEBEF;--mint:#E2EEDC;--sand:#F3E6DA;--rose:#F6DCE3;--lilac:#E4E0F2;
  --amber:#E0A15E;--line:#EADBCD;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.round{font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;margin:0}
a{color:var(--brand)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 20px 124px;display:flex;flex-direction:column;gap:16px}
.hidden{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-name{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:20px;line-height:1.2}
.brand-sub{font-size:13px;color:var(--sub)}
.icon-btn{width:44px;height:44px;border-radius:22px;border:none;background:var(--peach);display:flex;align-items:center;justify-content:center;flex:none}
.page-title{font-size:22px}

/* tabs */
.tabs{display:grid;gap:4px;padding:4px;background:var(--sand);border-radius:999px}
.tab{height:42px;border:none;border-radius:999px;background:transparent;color:var(--sub);font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15px}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(120,80,50,.12)}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:0 2px 10px rgba(120,80,50,.06);display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-head h2{font-size:16px}
.muted{font-size:13px;color:var(--sub)}
.hero{position:relative;border-radius:28px;padding:22px;color:#fff;overflow:hidden;background:var(--brand)}
.hero.fam{background:var(--fam)}
.hero .label{font-size:14px;opacity:.92}
.hero .big{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:36px;margin-top:2px}
.hero .split{display:flex;gap:22px;margin-top:12px;font-size:14px}
.hero .split b{display:block;font-size:16px}
.hero svg.deco{position:absolute;right:-6px;bottom:-8px}
.bar{height:12px;background:var(--sand);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:999px}
.bar.thin{height:8px}
.bar.over>i{background:var(--brand)}
.hero .bar{background:rgba(255,255,255,.25);height:10px}
.hero .bar>i{background:var(--butter)}

/* list rows */
.list{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.section-head h2{font-size:17px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;border:none;width:100%;text-align:left}
.badge{width:40px;height:40px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:16px;color:var(--ink)}
.badge.sm{width:32px;height:32px;border-radius:11px;font-size:14px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.r-title{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{font-size:12px;color:var(--sub)}
.amt{font-weight:700;font-size:15px;white-space:nowrap}
.amt.in{color:var(--fam)}
.empty{background:#fff;border-radius:18px;padding:20px;text-align:center;color:var(--sub);font-size:14px}

/* buttons */
.btn{height:48px;border:none;border-radius:16px;background:var(--brand);color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:16px;padding:0 18px}
.btn:hover{background:var(--brand-d)}
.btn.fam{background:var(--fam)}
.btn.ghost{background:transparent;color:var(--brand);border:2px dashed #D9BBA5}
.btn.soft{background:var(--peach);color:var(--ink)}
.btn.danger{background:transparent;color:#9B2C2C;border:2px solid #E8C2C2}
.btn.small{height:36px;border-radius:12px;font-size:13px;padding:0 12px}
.link-btn{background:none;border:none;color:var(--brand);font-weight:700;font-size:14px;min-height:44px;padding:0 4px}

/* breakdown */
.bd{display:flex;align-items:center;gap:10px}
.bd .top-line{display:flex;justify-content:space-between;font-size:13px;gap:8px}

/* month bars */
.mbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:150px}
.mbar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.mbar i{display:block;width:100%;max-width:30px;border-radius:10px 10px 6px 6px;background:#F3D3BF;min-height:3px}
.mbar.now i{background:var(--brand)}
.mbar.fam i{background:#BFD6DC}
.mbar.fam.now i{background:var(--fam)}
.mbar span{font-size:12px;color:var(--sub)}
.mbar.now span{color:var(--ink);font-weight:700}

/* tip */
.tip{display:flex;align-items:center;gap:12px;background:var(--butter);border-radius:20px;padding:12px 16px;font-size:14px;line-height:1.5}
.tip p{margin:0}
.alert{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #F3D3BF;border-radius:18px;padding:10px 14px;font-size:13px;line-height:1.45}

/* group */
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.member{background:#fff;border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.member b{font-size:14px}
.pos{color:var(--fam);font-weight:700;font-size:12px}
.neg{color:var(--brand);font-weight:700;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;border:2px solid transparent;border-radius:999px;background:#fff;padding:0 14px;font-size:14px;font-weight:500}
.chip.on{border-color:var(--brand);background:var(--peach)}
.settle{background:var(--butter);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.settle-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px}

/* cat */
.cat-hero{background:var(--butter);border-radius:26px;padding:18px 20px;display:flex;gap:16px;align-items:flex-end}
.avg-box{background:var(--bg);border-radius:14px;padding:8px 12px}
.minibars{display:grid;grid-template-columns:repeat(6,18px);gap:6px;align-items:end;height:92px}
.minibars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.minibars i{display:block;width:18px;background:#E9C08E;border-radius:7px 7px 4px 4px;min-height:3px}
.minibars .now i{background:var(--brand)}
.minibars span{font-size:10px;color:var(--sub2);white-space:nowrap}
.supply{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.supply .actions{display:flex;gap:8px;justify-content:flex-end}

/* calendar */
.cal{background:#fff;border-radius:24px;padding:12px 10px 10px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;color:var(--sub);padding-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.day{height:48px;border:2px solid transparent;border-radius:14px;background:transparent;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.day.past{color:#9A8576}
.day.sel{border-color:var(--brand);background:var(--peach)}
.day.today{background:var(--brand);color:#fff}
.day.today.sel{border-color:var(--brand-d)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--sub);padding-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:4px}
.plan{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px}
.plan .stripe{width:6px;align-self:stretch;border-radius:3px}
.icon-del{width:36px;height:36px;border:none;border-radius:12px;background:var(--sand);display:flex;align-items:center;justify-content:center;flex:none}

/* bottom nav */
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:84px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -4px 16px rgba(120,80,50,.08);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:var(--sub);font-size:12px;min-height:44px;justify-content:center}
.nav-i.on{color:var(--brand);font-weight:700}
.fab{justify-self:center;width:60px;height:60px;margin-top:-30px;border-radius:30px;border:none;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(169,82,43,.35)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(74,52,40,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{font-size:19px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:var(--sand);border-radius:999px}
.seg button{height:40px;border:none;border-radius:999px;background:transparent;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink)}
.amount-box{background:#fff;border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:12px}
.amount-box input{border:none;outline:none;background:transparent;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:32px;width:100%;min-width:0}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat-btn{min-height:64px;border:2px solid transparent;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;padding:6px 0}
.cat-btn.on{border-color:var(--brand)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.field.full{grid-column:1/-1}
.field input,.field select{height:46px;border:2px solid transparent;border-radius:14px;background:#fff;padding:0 12px;font-size:15px;color:var(--ink);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--amber)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:0 12px;min-height:40px;font-size:14px;color:var(--ink)}
.checks input{width:18px;height:18px;accent-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="bottom" id="nav" aria-label="主選單"></nav>
<div class="sheet-wrap hidden" id="sheetWrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- 常數 ---------- */
const KEY = 'meow-ledger-v1';
const OUT_CATS = [
  {id:'food',b:'食',l:'餐飲',t:'peach'},{id:'move',b:'行',l:'交通',t:'sky'},
  {id:'shop',b:'購',l:'購物',t:'rose'},{id:'pet',b:'貓',l:'毛孩',t:'butter'},
  {id:'fun',b:'樂',l:'娛樂',t:'lilac'},{id:'home',b:'住',l:'居住',t:'mint'},
  {id:'med',b:'醫',l:'醫療',t:'sky'},{id:'etc',b:'他',l:'其他',t:'sand'}
];
const FAM_CATS = [
  {id:'house',b:'住',l:'房貸房租',t:'mint'},{id:'grocery',b:'菜',l:'菜錢日用',t:'peach'},
  {id:'util',b:'電',l:'水電瓦斯網路',t:'sky'},{id:'pet',b:'貓',l:'家裡的貓',t:'butter'},
  {id:'edu',b:'學',l:'教育',t:'lilac'},{id:'fmed',b:'醫',l:'醫療',t:'rose'},
  {id:'outing',b:'遊',l:'出遊聚餐',t:'peach'},{id:'fetc',b:'他',l:'其他',t:'sand'}
];
const IN_CATS = [
  {id:'pay',b:'薪',l:'薪水',t:'sky'},{id:'job',b:'案',l:'接案',t:'mint'},
  {id:'gift',b:'禮',l:'紅包',t:'peach'},{id:'ietc',b:'他',l:'其他收入',t:'sand'}
];
const ACCOUNTS = ['現金','信用卡','悠遊卡','銀行'];
const C_PERSONAL = '#C9763F', C_FAMILY = '#2F6472', C_CAT = '#E0A15E';
const SOON = 16;

/* ---------- 圖示 ---------- */
const I = {
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H4 Z"/></svg>',
  stats:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 20V12 M12 20V5 M18 20v-6"/></svg>',
  cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16 M8.5 3.5v4 M15.5 3.5v4"/></svg>',
  me:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 3.8-6 7-6s6 2 7 6"/></svg>',
  paw:(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c||'#FFF8F0'}" aria-hidden="true"><ellipse cx="12" cy="15.5" rx="4.2" ry="3.4"/><circle cx="6.8" cy="10.6" r="1.8"/><circle cx="10" cy="7.4" r="1.8"/><circle cx="14" cy="7.4" r="1.8"/><circle cx="17.2" cy="10.6" r="1.8"/></svg>`,
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>',
  next:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>',
  bell:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A9522B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14 M10 7V5h4v2 M7 7l1 13h8l1-13"/></svg>',
  cat:(s,fill)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#4A3428" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5 L5 3.5 L10 6.8 Q12 6.3 14 6.8 L19 3.5 L18 9.5 Q20 12 19.2 15 Q17.5 20 12 20 Q6.5 20 4.8 15 Q4 12 6 9.5 Z" fill="${fill||'#FBE3D3'}"/><circle cx="9.3" cy="12.4" r="0.9" fill="#4A3428" stroke="none"/><circle cx="14.7" cy="12.4" r="0.9" fill="#4A3428" stroke="none"/><path d="M11.2 14.6 L12 15.3 L12.8 14.6"/></svg>`,
  happyCat:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4A3428" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 9.5 L5 3.5 L10 6.8 Q12 6.3 14 6.8 L19 3.5 L18 9.5 Q20 12 19.2 15 Q17.5 20 12 20 Q6.5 20 4.8 15 Q4 12 6 9.5 Z" fill="#FFF8F0"/><path d="M8.4 12.6 q0.9 0.9 1.8 0 M13.8 12.6 q0.9 0.9 1.8 0" stroke-linecap="round"/><path d="M11.2 14.6 L12 15.3 L12.8 14.6"/></svg>',
  sleepCat:'<svg class="deco" width="132" height="96" viewBox="0 0 132 96" fill="none" aria-hidden="true"><path d="M30 80 Q28 50 56 46 Q74 44 92 50 Q118 58 116 80 Z" fill="#FCEFC7"/><path d="M84 52 L82 34 L94 44 Q100 43 106 46 L116 36 L114 54 Q120 62 116 72 Q110 82 98 80 Q86 78 84 68 Z" fill="#FCEFC7"/><path d="M92 60 q3 3 6 0 M104 60 q3 3 6 0" stroke="#4A3428" stroke-width="1.8" stroke-linecap="round"/><path d="M99 66 l2 1.5 l2 -1.5" stroke="#4A3428" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 80 Q16 78 18 66 Q20 58 28 62" stroke="#FCEFC7" stroke-width="8" stroke-linecap="round"/><text x="118" y="34" fill="#FFF8F0" font-size="12" font-weight="700">z</text><text x="124" y="24" fill="#FFF8F0" font-size="9" font-weight="700">z</text></svg>'
};
const FURS = ['#FBE3D3','#D9D2C9','#FCEFC7','#DCEBEF','#E2EEDC','#F6DCE3','#E4E0F2'];

/* ---------- 工具 ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addMonths = (d,n) => new Date(d.getFullYear(), d.getMonth()+n, 1);
const dim = d => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
const daysBetween = (a,b) => Math.round((parse(ymd(b)) - parse(ymd(a))) / 86400000);
const fmt = n => Math.round(n).toLocaleString('en-US');
const sum = arr => arr.reduce((s,e)=>s+(Number(e.amount)||0),0);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WK = ['日','一','二','三','四','五','六'];
function today(){ return parse(ymd(new Date())); }
function dateLabel(s){
  const t = today(), d = parse(s), diff = daysBetween(d, t);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === -1) return '明天';
  return `${d.getMonth()+1}/${d.getDate()}`;
}

/* ---------- 資料 ---------- */
function blank(){
  return { entries:[], budget:{personal:30000,family:55000}, groups:[], plans:[], cats:[], supplies:[], currentCat:null };
}
function seed(){
  const S = blank(); const t = today();

/* ---------- 共用查詢 ---------- */
function catsFor(type, scope){ return type==='in' ? IN_CATS : (scope==='family' ? FAM_CATS : OUT_CATS); }
function catOf(e){ return catsFor(e.type, e.scope).find(c=>c.id===e.cat) || (e.type==='in'?IN_CATS[3]:(e.scope==='family'?FAM_CATS[7]:OUT_CATS[7])); }
function monthOut(scope, mk){ return S.entries.filter(e=>e.scope===scope && e.type==='out' && e.date.startsWith(mk)); }
function curCat(){ return S.cats.find(c=>c.id===S.currentCat) || S.cats[0] || null; }
function catEntries(cat){
  if (!cat) return [];
  return S.entries.filter(e=>e.type==='out' && e.cat==='pet' && (e.catId===cat.id || (!e.catId && S.cats[0] && S.cats[0].id===cat.id)));
}
function runout(s){ return addDays(parse(s.buyDate), Number(s.life)||0); }
function plansOn(ds){
  const d = parse(ds), last = dim(d);
  return S.plans.filter(p => p.kind==='monthly' ? (Number(p.day)===d.getDate() || (Number(p.day)>last && d.getDate()===last)) : p.date===ds);
}
function runoutsOn(ds){ return S.supplies.filter(s => ymd(runout(s))===ds); }

}

/* ---------- 首頁：分帳 ---------- */
function balances(g){
  const b = {}; g.members.forEach(m=>b[m]=0);
  g.expenses.forEach(x=>{
    if (x.kind==='transfer'){ b[x.from]=(b[x.from]||0)+x.amount; b[x.to]=(b[x.to]||0)-x.amount; return; }
    b[x.payer]=(b[x.payer]||0)+x.amount;
    const share = x.amount / x.split.length;
    x.split.forEach(m=>{ b[m]=(b[m]||0)-share; });
  });
  return b;
}
function settlement(b){
  const cr=[], db=[];
  Object.entries(b).forEach(([m,v])=>{ if (v>0.5) cr.push({m,v}); else if (v<-0.5) db.push({m,v:-v}); });
  cr.sort((a,c)=>c.v-a.v); db.sort((a,c)=>c.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<db.length && j<cr.length){
    const a = Math.min(db[i].v, cr[j].v);
    out.push({from:db[i].m,to:cr[j].m,amount:Math.round(a)});
    db[i].v-=a; cr[j].v-=a;
    if (db[i].v<0.5) i++; if (cr[j].v<0.5) j++;
  }
  return out;
}

      <div class="bar thin"><i style="width:${Math.max(Math.round(s.ratio*100),2)}%;${s.left<=SOON?'background:var(--brand)':''}"></i></div>

    </div>`).join('') : '<div class="empty">還沒有用品，新增一項試試看</div>'}
  </section>`;
}

/* ---------- 統計 ---------- */
function viewStats(){
  const t = today(), mk = monthKey(t), sc = UI.statScope;
  const es = monthOut(sc, mk);
  const cats = sc==='family'?FAM_CATS:OUT_CATS;
  const groups = {}; es.forEach(e=>groups[e.cat]=(groups[e.cat]||0)+Number(e.amount));
  const top = Object.entries(groups).sort((a,b)=>b[1]-a[1])[0];
  const out = sum(es), bud = Number(S.budget[sc])||0;
  let tip = '這個月還沒有花錢，貓咪很滿意喵。';
  if (top){ const c = cats.find(x=>x.id===top[0]); tip = `${c?c.l:'其他'}是這個月花最多的地方，${bud? (out<=bud?'不過還在預算內，繼續保持喵。':'已經超出預算了，要省一點喵。') : '要不要設定預算呢？'}`; }
  return `
  <header class="top"><h1 class="page-title">統計</h1><span class="muted" style="font-weight:700;color:var(--ink)">${t.getFullYear()} 年 ${t.getMonth()+1} 月</span></header>
  <div class="tabs" role="tablist" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <button class="tab ${sc==='personal'?'on':''}" role="tab" aria-selected="${sc==='personal'}" data-act="stat" data-v="personal">個人</button>
    <button class="tab ${sc==='family'?'on':''}" role="tab" aria-selected="${sc==='family'}" data-act="stat" data-v="family">家庭</button>
  </div>
  <section class="card"><div class="card-head"><h2>近半年支出</h2><span class="muted">本月至今 NT$ ${fmt(out)}</span></div>${monthBars(sc)}</section>
  <section class="card"><h2 style="font-size:16px">錢都花去哪了</h2>${breakdown(es, cats, sc==='family')}</section>
  <div class="tip">${I.happyCat}<p>${esc(tip)}</p></div>`;
}

/* ---------- 行事曆 ---------- */
function viewCal(){
  const t = today(), m0 = UI.calMonth, last = dim(m0), start = m0.getDay();
  const cells = [];
  for (let i=0;i<start;i++) cells.push('<div aria-hidden="true"></div>');
  for (let d=1; d<=last; d++){
    const dt = new Date(m0.getFullYear(), m0.getMonth(), d), ds = ymd(dt);
    const ps = plansOn(ds), rs = runoutsOn(ds);
    const dots = [];
    if (ps.some(p=>p.scope==='personal')) dots.push(C_PERSONAL);
    if (ps.some(p=>p.scope==='family')) dots.push(C_FAMILY);
    if (rs.length) dots.push(C_CAT);
    const isT = ds===ymd(t), isS = ds===UI.calSel;
    const cls = ['day', dt<t?'past':'', isT?'today':'', isS?'sel':''].join(' ');
    const n = ps.length + rs.length;
    cells.push(`<button class="${cls}" data-act="cal-day" data-v="${ds}" aria-pressed="${isS}" aria-label="${m0.getMonth()+1} 月 ${d} 日${n?'，'+n+' 項排程':''}"><span>${d}</span><span class="dots">${dots.map(c=>`<i style="background:${isT?'#FCEFC7':c}"></i>`).join('')}</span></button>`);
  }
  const sel = UI.calSel, sd = parse(sel), ps = plansOn(sel), rs = runoutsOn(sel);
  const spent = S.entries.filter(e=>e.date===sel && e.type==='out');
  const planTotal = sum(ps.filter(p=>!p.income));
  const isToday = sel===ymd(t);
  const spentSum = sum(spent);
  return `
  <header class="top"><h1 class="page-title">行事曆</h1>
    <div style="display:flex;align-items:center;gap:2px">
      <button class="icon-btn" style="background:transparent" aria-label="上個月" data-act="cal-month" data-v="-1">${I.back}</button>
      <span style="font-weight:700;font-size:15px">${m0.getFullYear()} 年 ${m0.getMonth()+1} 月</span>
      <button class="icon-btn" style="background:transparent" aria-label="下個月" data-act="cal-month" data-v="1">${I.next}</button>
    </div></header>
  <section class="cal" aria-label="月曆">
    <div class="wk">${WK.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="days">${cells.join('')}</div>
    <div class="legend"><span><i style="background:${C_PERSONAL}"></i>個人</span><span><i style="background:${C_FAMILY}"></i>家庭</span><span><i style="background:${C_CAT}"></i>貓咪補貨</span></div>
  </section>
  <section class="list" aria-label="當天排程">
    <div class="section-head"><h2>${isToday?'今天・':''}${sd.getMonth()+1}/${sd.getDate()}（${WK[sd.getDay()]}）</h2><span class="muted">預計 NT$ ${fmt(planTotal)}</span></div>
    ${isToday && planTotal ? `<div class="tip" style="flex-direction:column;align-items:stretch;gap:8px;font-size:13px">
      <div style="display:flex;justify-content:space-between;gap:8px"><span>今天已花 <b>NT$ ${fmt(spentSum)}</b></span><span>${spentSum<=planTotal?'還有 NT$ '+fmt(planTotal-spentSum)+' 的空間':'比預計多花 NT$ '+fmt(spentSum-planTotal)}</span></div>
      <div class="bar thin" style="background:#FFF8F0"><i style="width:${Math.min(Math.round(spentSum/planTotal*100),100)}%"></i></div></div>`:''}
    ${ps.map(p=>`<div class="plan"><span class="stripe" style="background:${p.scope==='family'?C_FAMILY:C_PERSONAL}"></span>
      <span class="grow"><span class="r-title">${esc(p.name)}</span><span class="r-meta">${p.scope==='family'?'家庭':'個人'}・${p.kind==='monthly'?'每月 '+p.day+' 日':'預計'}</span></span>
      <span class="amt ${p.income?'in':''}">${p.income?'+':''}${fmt(p.amount)}</span>
      <button class="icon-del" aria-label="刪除 ${esc(p.name)}" data-act="del-plan" data-id="${p.id}">${I.trash}</button></div>`).join('')}
    ${rs.map(s=>{ const c=S.cats.find(x=>x.id===s.catId); return `<div class="plan"><span class="stripe" style="background:${C_CAT}"></span>
      <span class="grow"><span class="r-title">${esc(s.name)} 預計用完</span><span class="r-meta">${c?esc(c.name)+'・':''}記得補貨</span></span><span class="amt">約 ${fmt(s.price)}</span></div>`; }).join('')}
    ${!ps.length && !rs.length ? '<div class="empty">這天沒有排程，貓咪在睡午覺</div>' : ''}
    <button class="btn ghost" data-act="new-plan">＋ 新增預計開銷或排程</button>
    ${spent.length?`<div class="section-head" style="margin-top:6px"><h2 style="font-size:15px">當天實際記帳</h2><span class="muted">NT$ ${fmt(spentSum)}</span></div>${spent.map(entryRow).join('')}`:''}
  </section>`;
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1800); }

/* ---------- 事件 ---------- */
document.addEventListener('click', ev=>{
  if (ev.target.id==='sheetWrap'){ closeSheet(); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  switch(a){
    case 'nav': UI.view = v; render(); window.scrollTo(0,0); break;
    case 'tab': UI.tab = v; render(); break;
    case 'stat': UI.statScope = v; render(); break;
    case 'add': openEntry(null, el.dataset.scope); break;
    case 'edit': openEntry(id); break;
    case 'close': closeSheet(); break;
    case 'd-type': syncDraft(); draft.type = v; draft.cat = null; renderEntry(); break;
    case 'd-scope': syncDraft(); draft.scope = v; if (draft.type==='out' && draft.cat!=='pet') draft.cat = null; renderEntry(); break;
    case 'd-cat': syncDraft(); draft.cat = v; renderEntry(); break;
    case 'del-entry':
      if (confirm('確定刪除這筆帳目？')){ S.entries = S.entries.filter(x=>x.id!==draft.id); save(); closeSheet(); render(); toast('已刪除'); }
      break;
    case 'group': UI.groupId = id; render(); break;
    case 'new-group': openNewGroup(); break;
    case 'group-add': openGroupAdd(); break;
    case 'settle': {
      const g = S.groups.find(x=>x.id===UI.groupId);
      g.expenses.push({id:uid(),kind:'transfer',from:el.dataset.from,to:el.dataset.to,amount:Number(el.dataset.amt),date:ymd(today())});
      save(); render(); toast('記下還款了喵'); break;
    }
    case 'g-del': {
      const g = S.groups.find(x=>x.id===UI.groupId);
      if (confirm('確定刪除這筆？')){ g.expenses = g.expenses.filter(x=>x.id!==id); save(); render(); }
      break;
    }
    case 'g-remove':
      if (confirm('確定刪除整個群組和裡面所有帳目？')){ S.groups = S.groups.filter(x=>x.id!==UI.groupId); UI.groupId=null; save(); render(); }
      break;
    case 'pick-cat': S.currentCat = id; save(); render(); break;
    case 'new-cat': openNewCat(); break;
    case 'del-cat':
      if (confirm('確定刪除這隻貓咪和牠的用品紀錄？（記帳紀錄會保留）')){
        S.cats = S.cats.filter(x=>x.id!==id); S.supplies = S.supplies.filter(x=>x.catId!==id);
        if (S.currentCat===id) S.currentCat = S.cats[0]?S.cats[0].id:null; save(); render();
      }
      break;
    case 'new-supply': openNewSupply(); break;
    case 'rebuy': {
      const s = S.supplies.find(x=>x.id===id); if (!s) break;
      s.buyDate = ymd(today());
      S.entries.push({id:uid(),scope:'personal',type:'out',cat:'pet',amount:s.price,date:s.buyDate,note:s.name,account:'現金',catId:s.catId,supplyId:s.id});
      save(); render(); toast('已記一筆，計時重新開始'); break;
    }
    case 'del-supply':
      if (confirm('確定刪除這項用品？（已記的帳不會刪除）')){ S.supplies = S.supplies.filter(x=>x.id!==id); save(); render(); }
      break;
    case 'cal-month': UI.calMonth = addMonths(UI.calMonth, Number(v)); render(); break;
    case 'cal-day': UI.calSel = v; render(); break;
    case 'new-plan': openNewPlan(); break;
    case 'del-plan': {
      const p = S.plans.find(x=>x.id===id);
      if (p && confirm(p.kind==='monthly'?'這是每月固定項目，刪除後每個月都會移除，確定嗎？':'確定刪除這個排程？')){ S.plans = S.plans.filter(x=>x.id!==id); save(); render(); }
      break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = `喵帳本備份-${ymd(today())}.json`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000); break;
    }
    case 'reset-sample':
      if (confirm('會用示範資料取代目前所有資料，確定嗎？')){ S = seed(); save(); UI.groupId=null; render(); toast('已載入示範資料'); }
      break;
    case 'clear-all':
      if (confirm('會刪除所有資料而且無法復原，確定嗎？')){ S = blank(); save(); UI.groupId=null; render(); toast('已清空，從頭開始吧'); }
      break;
  }
});

document.addEventListener('change', ev=>{
  const el = ev.target;
  if (el.dataset.actChange==='import' && el.files && el.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.entries)) throw new Error('bad');
        if (!confirm('匯入會取代目前所有資料，確定嗎？')) return;
        S = Object.assign(blank(), d); save(); UI.groupId=null; render(); toast('匯入完成');
      } catch(e){ alert('這個檔案不是喵帳本的備份檔'); }
    };
    r.readAsText(el.files[0]);
  }
});

document.addEventListener('submit', ev=>{
  const f = ev.target, kind = f.dataset.form; if (!kind) return;
  ev.preventDefault();
  const fd = new FormData(f);
  if (kind==='entry'){
    syncDraft();
    const amt = Number(draft.amount);
    if (!(amt>0)){ toast('請輸入金額'); return; }
    const rec = {...draft, amount:amt};
    if (rec.cat==='pet'){ rec.catId = fd.get('catId') || rec.catId || S.currentCat || undefined; } else { delete rec.catId; }
    if (rec.type==='in') rec.scope = rec.scope || 'personal';
    if (rec.id){ S.entries = S.entries.map(x=>x.id===rec.id?rec:x); }
    else { rec.id = uid(); S.entries.push(rec); }
    save(); closeSheet(); render(); toast('記好了喵');
  }
  else if (kind==='group'){
    const others = String(fd.get('members')).split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean).filter(s=>s!=='你');
    const members = ['你', ...Array.from(new Set(others))];
    if (members.length<2){ toast('至少要有一位朋友'); return; }
    const g = {id:uid(),name:String(fd.get('name')).trim(),members,expenses:[]};
    S.groups.push(g); UI.groupId = g.id; UI.tab='group'; UI.view='home'; save(); closeSheet(); render();
  }
  else if (kind==='g-exp'){
    const g = S.groups.find(x=>x.id===UI.groupId);
    const split = fd.getAll('split');
    if (!split.length){ toast('至少選一位分攤的人'); return; }
    g.expenses.push({id:uid(),kind:'expense',name:String(fd.get('name')).trim(),amount:Number(fd.get('amount')),payer:String(fd.get('payer')),split,date:String(fd.get('date'))});
    save(); closeSheet(); render(); toast('加入了');
  }
  else if (kind==='plan'){
    const date = String(fd.get('date')), k = String(fd.get('kind'));
    const p = {id:uid(),kind:k,name:String(fd.get('name')).trim(),amount:Number(fd.get('amount')),scope:String(fd.get('scope'))};
    if (fd.get('income')) p.income = true;
    if (k==='monthly') p.day = parse(date).getDate(); else p.date = date;
    S.plans.push(p); UI.calSel = date; UI.calMonth = addMonths(parse(date),0);
    save(); closeSheet(); render(); toast('放進行事曆了');
  }
  else if (kind==='supply'){
    const cat = curCat();
    const s = {id:uid(),catId:cat.id,name:String(fd.get('name')).trim(),price:Number(fd.get('price')),buyDate:String(fd.get('buyDate')),life:Math.max(1,Number(fd.get('life')))};
    S.supplies.push(s);
    S.entries.push({id:uid(),scope:String(fd.get('scope')),type:'out',cat:'pet',amount:s.price,date:s.buyDate,note:s.name,account:'現金',catId:cat.id,supplyId:s.id});
    save(); closeSheet(); render(); toast('新增了，也幫你記帳了');
  }
  else if (kind==='cat'){
    const c = {id:uid(),name:String(fd.get('name')).trim(),fur:String(fd.get('fur')||FURS[0])};
    S.cats.push(c); S.currentCat = c.id; save(); closeSheet(); render(); toast('歡迎 '+c.name);
  }
  else if (kind==='budget'){
    S.budget.personal = Math.max(0, Number(fd.get('personal'))||0);
    S.budget.family = Math.max(0, Number(fd.get('family'))||0);
    save(); render(); toast('預算已更新');
  }
});

document.addEventListener('keydown', ev=>{ if (ev.key==='Escape' && !document.getElementById('sheetWrap').classList.contains('hidden')) closeSheet(); });

render();
})();
</script>
</body>
</html>
