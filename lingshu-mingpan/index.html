<title>後天五行靈數命盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.3/lunar.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one narrow "poster" column in a dusty-rose world (from the reference reel): thin frame lines, small letter-spaced labels, frosted cards with hairline borders. Single light theme by choice. */
:root{
  color-scheme:light;
  /* 低彩度玫瑰灰底＋近白卡片：降低粉色面積與亮度落差，所有文字對比 ≥ 4.5:1 */
  --bg:#f4ecec; --bg2:#efe4e5; --glass:rgba(255,251,251,.78); --glass-strong:#fffbfb;
  --hair:#e4d3d7; --frame:#dcc6cb;
  --ink:#3a2b30; --soft:#5f4a50; --faint:#7a6268;
  --rose:#8a3b54; --rose-deep:#6b2a42; --rose-wash:#f6ebee;
  --ok:#3b6449; --ok-wash:#e8f0ea; --bad:#94383a; --bad-wash:#f8e9e8;
  --wood:#3b6449; --fire:#9e3c4e; --earth:#85602f; --metal:#64626b; --water:#36507a;
  --line-c:#8a3b54; --lv1:#faf3f4; --lv2:#f1e0e4; --lv3:#ddb4c0;
  --f:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --col:720px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.85;letter-spacing:.02em;padding-inline:16px;padding-block:0 40px;min-height:100%}
.frame{max-width:calc(var(--col) + 96px);margin:0 auto;border-inline:1px solid var(--frame);min-height:100vh;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--frame);font-size:13px;letter-spacing:.18em;color:var(--soft)}
.bar b{font-weight:500;color:var(--rose)}
main{width:100%;max-width:calc(var(--col) + 80px);margin:0 auto;padding:clamp(24px,5vw,48px) clamp(12px,4vw,40px);display:flex;flex-direction:column;gap:28px}
h1{font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.35;margin:0;letter-spacing:.08em;text-wrap:balance}
h1 em{font-style:normal;color:var(--rose)}
.lede{color:var(--soft);margin:6px 0 0;font-size:15px}
h2{font-weight:600;font-size:21px;margin:0;color:var(--rose);letter-spacing:.1em;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,var(--rose) 60%);box-shadow:0 0 0 3px var(--rose-wash);flex:none}
.eyebrow{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;color:var(--faint);margin-bottom:8px}
h3{font-size:15px;font-weight:600;margin:0 0 6px;color:var(--rose-deep);letter-spacing:.08em}
.card{background:var(--glass);border:1px solid var(--hair);border-radius:14px;padding:clamp(18px,4vw,28px);min-width:0}
.rule{width:44px;height:1px;background:var(--frame);margin:4px 0}
.muted{color:var(--soft)}.small{font-size:13.5px}.tiny{font-size:13px;color:var(--faint)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--frame)}
.tab{font:inherit;background:none;border:0;padding:8px 14px;color:var(--soft);letter-spacing:.14em;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--rose);border-bottom-color:var(--rose);font-weight:600}

/* form */
form{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:13.5px;letter-spacing:.12em;color:var(--soft)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--hair);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
input::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:560px){.two{grid-template-columns:minmax(0,1fr)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--hair);border-radius:8px;padding:8px;cursor:pointer;background:var(--glass-strong)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){border-color:var(--rose);background:var(--rose-wash);color:var(--rose);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--rose);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--soft)}
.check input{width:auto;accent-color:var(--rose)}
.headline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--rose);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.btn{font:inherit;letter-spacing:.2em;border:0;border-radius:10px;padding:12px 18px;background:var(--rose);color:#fff8f9;cursor:pointer;font-weight:600}
.btn:hover{background:var(--rose-deep)}
.btn.line{background:transparent;color:var(--rose);border:1px solid var(--rose);font-weight:500;letter-spacing:.08em;padding:8px 14px}
.btn.line:hover{background:var(--rose-wash)}
.btn.sm{font-size:13.5px;padding:6px 12px;letter-spacing:.06em}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.notice{border-top:1px solid var(--frame);padding-top:14px;color:var(--rose-deep);font-size:14.5px;font-weight:600;letter-spacing:.06em}
.err{color:var(--bad);font-size:14px}
.err:empty{display:none}
.tag{font-size:12px;letter-spacing:.1em;padding:1px 10px;border-radius:99px;border:1px solid var(--hair);color:var(--soft);font-weight:400}

/* chart */
.who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.who .nm{font-size:26px;font-weight:600;letter-spacing:.12em}
.meta{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:14px;color:var(--soft);margin-top:4px}
.meta b{color:var(--ink);font-weight:500}
.board{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.blk{border-top:1px solid var(--hair);padding-top:18px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.blk-h h3{margin:0}
.gridwrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.nine{position:relative;width:min(296px,100%);aspect-ratio:296/220}
.cell{position:absolute;width:22.97%;height:30.91%;border-radius:12px;background:var(--glass-strong);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center}
.cell .n{font-size:26px;font-weight:500;position:relative;z-index:2;line-height:1}
.cell .sc{position:absolute;top:4px;right:7px;font-size:12px;line-height:1;color:var(--rose);font-weight:600;z-index:2;font-variant-numeric:tabular-nums}
.cell .mk{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:12px;line-height:1;color:var(--rose);letter-spacing:0;z-index:2}
.cell.lv0{background:transparent;border-style:dashed}
.cell.lv0 .n,.cell.lv0 .sc{color:var(--faint)}
.cell.lv1{background:var(--lv1)}
.cell.lv2{background:var(--lv2)}
.cell.lv3{background:var(--lv3);border-color:var(--rose)}
.lines{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
.marklegend{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 16px;font-size:12.5px;color:var(--faint);letter-spacing:.06em}
/* birth digits */
.birth{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 18px}
.dg{display:flex;flex-direction:column;align-items:center;gap:6px}
.dg .cap{font-size:12px;letter-spacing:.2em;color:var(--faint)}
.dg .box{display:flex;gap:4px}
.dg .box span{width:32px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--hair);border-radius:8px;background:var(--glass-strong);font-size:20px;font-variant-numeric:tabular-nums}
.sums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.sum{border:1px solid var(--hair);border-radius:12px;background:var(--glass-strong);padding:12px 16px;text-align:center}
.sum .cap{font-size:12.5px;letter-spacing:.2em;color:var(--soft)}
.sum .v{font-size:28px;font-weight:600;line-height:1.4;font-variant-numeric:tabular-nums}
.sum.key{border-color:var(--rose);background:var(--rose-wash)}
.sum.key .v{color:var(--rose)}
/* label / value list */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin:0}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}}
.kv div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px dashed var(--hair)}
.kv dt{font-size:14px;color:var(--soft);letter-spacing:.1em}
.kv dd{margin:0;font-size:17px;font-weight:600;min-width:0}
.kv dd .sub{display:block;font-size:13.5px;font-weight:400;color:var(--soft);line-height:1.6}
.el{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.e-木{color:var(--wood)}.e-火{color:var(--fire)}.e-土{color:var(--earth)}.e-金{color:var(--metal)}.e-水{color:var(--water)}
.d-木{background:var(--wood)}.d-火{background:var(--fire)}.d-土{background:var(--earth)}.d-金{background:var(--metal)}.d-水{background:var(--water)}

.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:14px}
.tile{border:1px solid var(--hair);border-radius:12px;padding:14px 16px;background:var(--glass-strong);min-width:0}
.tile .big{font-size:22px;font-weight:600;line-height:1.4}
.tile p{margin:4px 0 0;font-size:14.5px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--hair);background:var(--glass-strong);border-radius:99px;padding:4px 14px;font-size:14px}
.chip b{color:var(--rose);font-variant-numeric:tabular-nums;font-weight:600}
.chip.half{border-style:dashed}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:0 9px;border-radius:99px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.pill.add{background:var(--ok-wash);color:var(--ok)}
.pill.flat{background:var(--rose-wash);color:var(--rose)}
.pill.sub{background:var(--bad-wash);color:var(--bad)}

/* flow */
.flowctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}
.flowctl .field{width:auto;min-width:120px}
.year{border:1px solid var(--hair);border-radius:12px;background:var(--glass-strong);padding:16px 18px}
.year .yh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--hair);padding-bottom:8px;margin-bottom:10px}
.year .yh b{font-size:19px;letter-spacing:.08em}
.year .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.year .grid2{grid-template-columns:minmax(0,1fr)}}
.year .k{font-size:12.5px;color:var(--faint);letter-spacing:.14em}
.year .v{font-size:18px;font-weight:600}
.year p{margin:2px 0 0;font-size:14.5px;color:var(--soft)}
.year .rel{display:flex;align-items:baseline;gap:10px;margin-top:6px;font-size:15px}
.year .rk{font-size:12.5px;color:var(--faint);letter-spacing:.1em;min-width:4.5em}
.year .v{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.year .k{margin-bottom:2px}
.year .pill{margin-left:4px}

.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:6px 18px;font-size:14.5px;margin-top:12px}
.keys div{display:flex;gap:10px}
.keys .k{color:var(--rose);font-weight:600;min-width:3.5em}
.numlist{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 18px;font-size:14.5px}
.numlist li{display:flex;gap:10px}
.numlist .k{color:var(--rose);font-weight:600;min-width:1em}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13.5px;color:var(--ok)}
.status.bad{color:var(--bad)}

/* admin */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.toolbar input{flex:1 1 200px;width:auto}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;border-top:1px solid var(--hair);padding:14px 0}
.rec:first-child{border-top:0}
.rec .nm{font-size:17px;font-weight:600;letter-spacing:.08em}
.rec .facts{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13.5px;color:var(--soft)}
.rec .ops{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.rec textarea{margin-top:8px;font-size:14px;min-height:60px;resize:vertical}
@media (max-width:520px){.rec{grid-template-columns:minmax(0,1fr)}.rec .ops{justify-content:flex-start}}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--bad)}
.empty{padding:28px 8px;text-align:center;color:var(--soft)}
footer{margin-top:auto;border-top:1px solid var(--frame);padding:16px clamp(16px,4vw,40px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;letter-spacing:.14em;color:var(--faint)}
#clip{position:absolute;left:-9999px}
@media (prefers-reduced-motion:no-preference){.reveal{animation:rv .4s ease}@keyframes rv{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}}
mark{background:linear-gradient(transparent 58%,var(--lv3) 58%);color:inherit;padding:0 1px}
.wide{border:1px solid var(--hair);border-radius:12px;background:var(--glass-strong);margin-top:16px;overflow:hidden}
.wide-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--hair);background:var(--rose-wash);font-size:14px;letter-spacing:.12em;color:var(--rose-deep);font-weight:600}
.wide-h .tiny{letter-spacing:.04em;font-weight:400}
.pers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.pers{grid-template-columns:minmax(0,1fr)}}
.per{display:flex;flex-direction:column;gap:6px;padding:14px 16px;min-width:0}
.per+.per{border-left:1px solid var(--hair)}
@media (max-width:520px){.per+.per{border-left:0;border-top:1px solid var(--hair)}}
.per.on{background:linear-gradient(var(--lv1),var(--lv1))}
.pk{font-size:13px;color:var(--soft);letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.now{font-size:12px;letter-spacing:.08em;color:#fff;background:var(--rose);border-radius:99px;padding:0 8px;line-height:1.7}
.pv{font-size:20px;font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gua{font-size:14px;font-weight:400;color:var(--soft);border:1px solid var(--hair);border-radius:6px;padding:0 7px;margin-left:6px}
.per .sub{font-size:13px;color:var(--soft)}
.sw{font-size:15px;font-weight:500;gap:6px 14px}
.swc{display:inline-flex;align-items:center;gap:6px}
.swc i{width:16px;height:16px;border-radius:50%;border:1px solid var(--hair);display:inline-block}
.els{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.elbox{border:1px solid var(--hair);border-radius:12px;background:var(--glass-strong);overflow:hidden}
.elbox-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--hair)}
.elbox-h .big{font-size:21px;font-weight:600;display:flex;align-items:baseline}
.traits{list-style:none;margin:0;padding:6px 18px}
.traits li{padding:9px 0 9px 18px;border-bottom:1px dashed var(--hair);position:relative;font-size:15.5px}
.traits li:last-child{border-bottom:0}
.traits li::before{content:"";position:absolute;left:2px;top:1.15em;width:6px;height:6px;border-radius:50%;background:var(--lv3)}
.elfoot{display:flex;flex-direction:column;gap:4px;padding:10px 18px;background:var(--lv1);border-top:1px solid var(--hair);font-size:14px}
.elfoot div{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:8px}
.fk{color:var(--soft);letter-spacing:.12em}
.explain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:560px){.explain{grid-template-columns:minmax(0,1fr)}}
.explain div{border:1px solid var(--hair);border-radius:10px;padding:10px 14px;background:var(--glass-strong);display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--soft)}
.explain b{color:var(--rose-deep);letter-spacing:.1em;font-size:14.5px}
.year{border:1px solid var(--hair);border-radius:14px;background:var(--glass-strong);overflow:hidden;padding:0}
.year .yh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:12px 18px;margin:0;border-bottom:1px solid var(--hair);background:var(--rose-wash)}
.year .yh b{font-size:22px;letter-spacing:.06em;margin-right:10px}
.roc{font-size:13.5px;color:var(--soft);letter-spacing:.08em}
.verdict{font-size:13.5px;font-weight:600;letter-spacing:.1em;padding:2px 12px;border-radius:99px;border:1px solid currentColor}
.verdict.add{color:var(--ok)}.verdict.flat{color:var(--rose)}.verdict.sub{color:var(--bad)}
.ybody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:600px){.ybody{grid-template-columns:minmax(0,1fr)}}
.ybox{padding:14px 18px;min-width:0}
.ybox+.ybox{border-left:1px solid var(--hair)}
@media (max-width:600px){.ybox+.ybox{border-left:0;border-top:1px solid var(--hair)}}
.yk{font-size:13.5px;color:var(--rose-deep);font-weight:600;letter-spacing:.14em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.yk span{font-weight:400;color:var(--faint);letter-spacing:.04em;font-size:12.5px}
.yv{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:18px;font-weight:600;margin:8px 0 4px}
.yn{width:34px;height:34px;border-radius:50%;border:1px solid var(--rose);color:var(--rose);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.vs{font-size:13px;font-weight:400;color:var(--soft)}
.yrel{font-size:14px;color:var(--ink);margin-bottom:2px}
.ylist{list-style:none;margin:6px 0 0;padding:0}
.ylist li{font-size:14.5px;color:var(--soft);padding:5px 0 5px 14px;border-top:1px dashed var(--hair);position:relative;line-height:1.7}
.ylist li::before{content:"";position:absolute;left:0;top:1.05em;width:5px;height:5px;border-radius:50%;background:var(--lv3)}
.ysum{margin:0;padding:10px 18px;border-top:1px solid var(--hair);font-size:14.5px;background:var(--lv1)}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-top:12px}
@media (max-width:600px){.scale{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scale div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;font-size:13px;color:var(--soft)}
.scale b{font-size:15px;color:var(--ink)}
.lv0{background:transparent}.scale .lv0{background:var(--glass-strong)}
.lv1{background:var(--lv1)}.lv2{background:var(--lv2)}.lv3{background:var(--lv3)}
.scale .lv3 b,.numlist .lv3 .k{color:var(--rose-deep)}
.numlist{gap:6px 10px}
.numlist li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;border:1px solid var(--hair)}
.numlist li.lv0{border-style:dashed;color:var(--faint)}
.numlist li.lv0 .k{color:var(--faint)}
.numlist .pts{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.ans{display:flex;flex-direction:column;gap:14px;margin-top:16px}

const POS = {1:[0,0],2:[1,0],3:[2,0],4:[0,1],5:[1,1],6:[2,1],7:[0,2],8:[1,2],9:[2,2],0:[3,2]};
const CELL = 68, GAP = 8;
const center = n => { const [c,r] = POS[n]; return [c*(CELL+GAP)+CELL/2, r*(CELL+GAP)+CELL/2]; };

const digits = s => String(s).split("").map(Number);
const dsum = n => digits(n).reduce((a,b)=>a+b,0);
const reduce1 = n => { while(n>9) n = dsum(n); return n; };
const mod9 = n => { const r = ((n%9)+9)%9; return r===0?9:r; };
const starOf = (roc,sex) => sex==="M" ? mod9(7-(roc-64)) : mod9(8+(roc-64));
function starInfo(roc,sex){ const s = starOf(roc,sex); const shown = s===5 ? (sex==="M"?2:8) : s; const [el,gua] = STAR[shown]; return {star:s,shown,el,gua}; }

}

/* ---------- calculation ---------- */
function compute(inp){
  const ys = String(inp.y).padStart(4,"0"), ms = pad2(inp.m), ds = pad2(inp.d);
  const all = digits(ys+ms+ds);
  const s1 = all.reduce((a,b)=>a+b,0), chain = [s1]; let cur = s1;
  while (cur>9){ cur = dsum(cur); if (cur>9) chain.push(cur); }
  const code = cur, mR = reduce1(dsum(ms)), dR = reduce1(dsum(ds));
  const marks = {}; for (let i=0;i<=9;i++) marks[i] = {o:0,t:0,q:0};
  all.forEach(n => marks[n].o++); chain.forEach(c => digits(c).forEach(n => marks[n].t++)); marks[code].q++;
  const score = {}; for (let i=0;i<=9;i++) score[i] = marks[i].o + marks[i].t*2 + marks[i].q*4;
  const missing = [1,2,3,4,5,6,7,8,9,0].filter(n => score[n]===0);
  let lines = LINES.filter(L => L.p.every(n => score[n]>0));
  const after = [starInfo(inp.lroc,inp.sex)];
  const afterMid = inp.lm>8 || (inp.lm===8 && (inp.ld>15 || inp.leap));
  const onMid = inp.lm===8 && inp.ld===15 && !inp.leap;
  if (afterMid || onMid) after.push(Object.assign(starInfo(inp.lroc+1,inp.sex),{onMid}));
  const elems = [...new Set(after.map(a=>a.el))];
  const boost = elems.map(e => { const src = Object.keys(GEN).find(k => GEN[k]===e); return {me:e,src,colors:COLORS[src]}; });
  return {ys,ms,ds,all,chain,code,lesson:Math.abs(mR-dR),influence:dR,marks,score,missing,lines,after,elems,boost};
}
function ageNow(inp){
  const now = new Date(); let a = now.getFullYear()-inp.y;
  if (now.getMonth()+1<inp.m || (now.getMonth()+1===inp.m && now.getDate()<inp.d)) a--;
  return Math.max(a,0);
}
function flowYears(inp, r, start, count){
  const out = [];
  for (let y=start; y<start+count; y++){
    const f = reduce1(reduce1(dsum(y)) + reduce1(dsum(r.ms+r.ds)));
    const roc = y-1911, ye = yearEl(roc), age = y-inp.y;
    const useAfter = r.after.length>1 && age>=40 ? r.after[1] : r.after[0];
    const me = useAfter.el, rel = relation(me, ye.el);
    const note = r.after.length>1 ? `這一年 ${age} 歲，看${age>=40?"40 歲以後":"40 歲以前"}的後天五行（${me}）` : "";
    let cny = ""; try{ const s = Lunar.fromYmd(y,1,1).getSolar(); cny = `${s.getMonth()}/${s.getDay()}`; }catch(e){}
    const fv = FLOW[f][1]==="good"?1:FLOW[f][1]==="bad"?-1:0;
    const rv = rel[2]==="add"?1:rel[2]==="sub"?-1:0;
    const tot = fv*0.3 + rv*0.7;
    const verdict = tot>=0.5?["順勢","add"]:tot<=-0.5?["需調整","sub"]:["平穩","flat"];
    const summary = {add:`環境給力，加上${FLOW[f][0]}的節奏，適合主動出擊、把握機會。`,
                     flat:`環境平穩，順著${FLOW[f][0]}的節奏走，穩定經營就會有進展。`,
                     sub:`環境阻力較多，${FLOW[f][0]}也需要多留意，先顧好自己，低調保守做決定。`}[verdict[1]];
    out.push({y,roc,age,f,ye,me,rel,note,cny,verdict,summary});
  }
  return out;
}

function gridSVG(r){
  const W = 4*CELL+3*GAP, H = 3*CELL+2*GAP;
  const segs = r.lines.map(L => {
    const pts = L.p.map(center);
    const d = pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
    return `<path d="${d}" fill="none" style="stroke:var(--line-c)" stroke-opacity="${L.half?.55:.7}" stroke-width="${L.half?2:3.5}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" ${L.half?'stroke-dasharray="5 6"':''}/>`;
  }).join("");
  const cells = [1,2,3,4,5,6,7,8,9,0].map(n => {
    const [c,rw] = POS[n], m = r.marks[n];
    const mk = "○".repeat(m.o)+"△".repeat(m.t)+"□".repeat(m.q);
    return `<div class="cell lv${lvl(r.score[n])}" style="left:${(c*(CELL+GAP)/W*100).toFixed(3)}%;top:${(rw*(CELL+GAP)/H*100).toFixed(3)}%"><span class="sc">${r.score[n]===0?"0":r.score[n]}</span><span class="n">${n}</span><span class="mk">${mk}</span></div>`;
  }).join("");
  return `<div class="nine" role="img" aria-label="九宮格分數">${cells}</div>`;
}

      ${r.missing.length?step("補足能量", P(`你缺少 ${r.missing.join("、")} 的能量。`), P(`可以在生活中刻意練習：${r.missing.slice(0,3).map(n=>`${n} 的${MEAN[n].split("、").slice(0,2).join("、")}`).join("；")}。`)):""}

  return html.replace(/。(?=[^<\s」）])/g, "<br>").replace(/。/g, "");

function calcExample(inp, r, now){
  const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const f = flowAt(inp, r, dt);
  const yd = String(f.pyYear).split("").map(Number), ys = yd.reduce((a,b)=>a+b,0), yr = reduce1(ys);
  const bd = (r.ms+r.ds).replace(/^0/,"").split("").map(Number);
  const md = [...digits(+r.ms), ...digits(+r.ds)], mds = md.reduce((a,b)=>a+b,0), mdr = reduce1(mds);
  const sumPy = yr + mdr, monthSum = f.py + f.mo, daySum = f.pm + dt.getDate();
  const red = n => n>9 ? `${n} → ${digits(n).join("+")} ＝ ${reduce1(n)}` : `${n}`;
  return `<div class="calc">
    <span class="calc-t">計算範例・以今天 ${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()} 為例</span>
    <div class="calc-row"><b>流年</b><span>${f.pyYear} 年：${yd.join("+")} ＝ ${red(ys)}；生日 ${+r.ms}/${+r.ds}：${md.join("+")} ＝ ${red(mds)}；${yr} ＋ ${mdr} ＝ ${red(sumPy)}</span></div>
    <div class="calc-row"><b>流月</b><span>流年 ${f.py} ＋ ${f.mo} 月 ＝ ${red(monthSum)}${f.mo!==dt.getMonth()+1?`<br><small class="calc-s">今天 ${dt.getMonth()+1}/${dt.getDate()} 還沒到 ${dt.getMonth()+1}/${+r.ds}，所以屬於 ${f.mo} 月的流月</small>`:""}</span></div>
    <div class="calc-row"><b>流日</b><span>流月 ${f.pm} ＋ ${dt.getDate()} 日 ＝ ${red(daySum)}</span></div>
    <p class="calc-n">${f.pyYear===dt.getFullYear()?"今年生日已經過了，所以用今年的年份算流年":`今年生日 ${+r.ms}/${+r.ds} 還沒到，所以流年還是用 ${f.pyYear} 年算`}</p>
  </div>`;
}

/* ---------- 檔案輸出 ---------- */
const SNAP_W = 820;                 // 固定以電腦版寬度排版，手機與電腦輸出一致
const MAX_AREA = 12e6, MAX_SIDE = 14000;   // 手機（特別是 iPhone）畫布上限約 1600 萬像素
const ignoreEl = el => el.classList && (el.classList.contains("actions") || el.classList.contains("editBtn") || el.classList.contains("edit-hint") || el.classList.contains("jump"));
async function snap(el){
  const r = el.getBoundingClientRect();
  const area = Math.max(1, r.width * r.height);
  const estH = area / Math.min(SNAP_W, Math.max(r.width, 1)) ;
  const sc = Math.max(0.6, Math.min(2, Math.sqrt(MAX_AREA / area), MAX_SIDE / Math.max(estH, r.height)));
  const bgc = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#f4ecec";
  return html2canvas(el, {scale:sc, backgroundColor:bgc, logging:false, useCORS:true, windowWidth:SNAP_W, ignoreElements:ignoreEl});
}
async function getDownloads(){
  if (downloads) return downloads;
  try{ if (window.claude && window.claude.use) downloads = await window.claude.use("downloads"); }catch(e){}
  return downloads;
}
const DL_MSG = {declined:"你取消了儲存", rate_limited:"已經有一個儲存視窗開著，請先完成或關閉它再試", too_large:"檔案太大，請改用儲存圖片", rejected_extension:"這個檔案格式無法儲存", extension_not_enabled:"這個檢視模式不支援 PDF 下載", bad_request:"檔案內容有問題，請重新整理頁面後再試"};
// 回傳 "saved" | "declined" | "fallback"
async function offerFile(blob, fname){
  const dl = await getDownloads();
  if (!dl) return "fallback";
  try{ await dl.save({filename:fname, data:blob}); return "saved"; }
  catch(e){
    const code = e && e.code;
    if (code==="declined"){ status(DL_MSG.declined); return "declined"; }
    if (code==="rate_limited" || code==="too_large"){ status(DL_MSG[code], true); return "declined"; }
    console.warn("downloads.save", e);
    return "fallback";
  }
}

async function saveReport(){
  if (typeof html2canvas==="undefined" || !window.jspdf){ status("報告書元件載入失敗，請重新整理頁面", true); return; }
  if (editing) setEdit(false);
  const btn = $("pdfBtn"); btn.disabled = true; status("報告書製作中，請稍候…");
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#f4ecec";
  const head = document.createElement("div");
  head.className = "rpt-head";
  const d = new Date();
  head.innerHTML = `<div class="rh-brand">Meng.喵　調頻 × 靈數解盤</div><div class="rh-title">後天五行靈數命盤報告書</div><div class="rh-meta">${esc(current.inp.name)}　製作日期 ${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}</div>`;
  $("out").prepend(head);
  const hide = [...document.querySelectorAll("#out .flowctl, #out .months-h .field, #out .dgrid")];
  hide.forEach(el => el.style.display = "none");
  const pages = [];
  try{
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    // 把內容切成適合一頁的小區塊：太高的區塊往下拆成子元素
    const blocks = [];
    const collect = (el, brk) => {
      if (!el || ignoreEl(el) || (el.offsetParent===null && el!==head)) return;
      brk = brk || el.classList.contains("pbreak");
      const h = el.getBoundingClientRect().height;
      const kids = [...el.children].filter(k => !ignoreEl(k) && k.offsetParent!==null);
      const hasBreakInside = el.querySelector(".pbreak");
      if ((h > 1700 || hasBreakInside) && kids.length > 1) kids.forEach((k,i) => collect(k, i===0 ? brk : false));
      else blocks.push({el, brk});
    };
    collect(head, false);
    [...$("out").children].forEach(sec => { if (sec!==head && !sec.classList.contains("actions") && !sec.classList.contains("jump")) collect(sec, true); });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"mm", format:"a4", compress:true});
    const PW = 210, PH = 297, M = 14, CW = PW - M*2;
    const paint = () => { pdf.setFillColor(bg); pdf.rect(0,0,PW,PH,"F"); };
    let y = M, page = 1;
    const footer = () => { pdf.setFontSize(8); pdf.setTextColor(122,98,104); pdf.text(String(page), PW/2, PH-6, {align:"center"}); };
    const newPage = () => { footer(); pdf.addPage(); page++; paint(); y = M; };
    paint();
    let i = 0;
    for (const {el, brk} of blocks){
      i++;
      if (brk && y > M + 60) newPage();
      status(`報告書製作中… ${Math.round(i/blocks.length*100)}%`);
      const cv = await snap(el);
      if (!cv.width || !cv.height) continue;
      const h = cv.height * CW / cv.width;
      if (h <= PH - M - y){ pdf.addImage(cv.toDataURL("image/jpeg",0.9), "JPEG", M, y, CW, h); y += h + 4; continue; }
      if (h <= PH - M*2){ newPage(); pdf.addImage(cv.toDataURL("image/jpeg",0.9), "JPEG", M, y, CW, h); y += h + 4; continue; }
      if (y > M) newPage();
      const pxPerMm = cv.width / CW, sliceH = Math.floor((PH - M*2) * pxPerMm);
      for (let sy = 0; sy < cv.height; sy += sliceH){
        const part = document.createElement("canvas"); part.width = cv.width; part.height = Math.min(sliceH, cv.height - sy);
        part.getContext("2d").drawImage(cv, 0, sy, cv.width, part.height, 0, 0, cv.width, part.height);
        if (sy > 0) newPage();
        const ph = part.height / pxPerMm;
        pdf.addImage(part.toDataURL("image/jpeg",0.9), "JPEG", M, y, CW, ph); y += ph + 4;
      }
    }
    footer();
    const blob = pdf.output("blob");
    const fname = `命盤報告書_${current.inp.name}_${current.r.ys}${current.r.ms}${current.r.ds}.pdf`;
    const res = await offerFile(blob, fname);
    if (res==="saved") status(`報告書已儲存，共 ${page} 頁`);
    else if (res==="fallback"){
      // 無法直接下載時：把每一頁做成圖片，讓使用者長按另存
      status("這個檢視模式無法直接下載 PDF，已改為顯示報告書圖片，可長按或右鍵另存", true);
      const cv = await snap($("out"));
      const b2 = await new Promise(res2 => cv.toBlob(res2, "image/png"));
      if (b2) showPreview(URL.createObjectURL(b2), "報告書圖片");
    }
  }catch(e){ console.error(e); status("報告書製作失敗："+(e.message||e)+"。請重新整理頁面再試一次", true); }
  finally{ head.remove(); hide.forEach(el => el.style.display = ""); btn.disabled = false; }
}

async function saveImage(){
  if (editing) setEdit(false);
  if (typeof html2canvas==="undefined"){ status("圖片元件載入失敗，請重新整理頁面", true); return; }
  const btn = $("imgBtn"); btn.disabled = true; status("圖片製作中…");
  const hide = [...document.querySelectorAll("#out .flowctl, #out .months-h .field, #out .dgrid")];
  hide.forEach(el => el.style.display = "none");
  try{
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await snap($("out"));
    // 補上底色（snap 為透明背景）
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#f4ecec";
    const c2 = document.createElement("canvas"); c2.width = canvas.width; c2.height = canvas.height;
    const g = c2.getContext("2d"); g.fillStyle = bg; g.fillRect(0,0,c2.width,c2.height); g.drawImage(canvas,0,0);
    const blob = await new Promise(res => c2.toBlob(res, "image/png"));
    if (!blob){ status("圖片太大，裝置無法產生。請改用「報告書下載」", true); return; }
    const fname = `命盤_${current.inp.name}_${current.r.ys}${current.r.ms}${current.r.ds}.png`;
    const res = await offerFile(blob, fname);
    if (res==="saved") status("圖片已儲存");
    else if (res==="fallback"){ showPreview(URL.createObjectURL(blob), "命盤圖片"); status("請在圖片上長按或按右鍵另存"); }
  }catch(e){ console.error(e); status("圖片製作失敗："+(e.message||e), true); }
  finally{ hide.forEach(el => el.style.display = ""); btn.disabled = false; }
}
function showPreview(url, title){
  let ov = $("imgOverlay");
  if (!ov){ ov = document.createElement("div"); ov.id = "imgOverlay"; ov.className = "overlay"; document.body.appendChild(ov);
    ov.addEventListener("click", e => { if (e.target===ov || e.target.dataset.close!==undefined) ov.hidden = true; }); }
  ov.innerHTML = `<div class="ov-box"><div class="ov-h"><span>${title||"圖片"}：長按或右鍵另存</span><button class="btn line sm" data-close>關閉</button></div><img src="${url}" alt="命盤圖片"></div>`;
  ov.hidden = false;
}
function status(t,bad){ const s=$("actStatus"); if(!s) return; s.textContent=t; s.className="status"+(bad?" bad":""); }
function summaryText(){
  const {inp,r,flow} = current;
  const hourTxt = hourLabel(inp.hour, inp.jiTime);
  return [
    `【後天五行靈數命盤】${inp.name}（${inp.sex==="M"?"男":"女"}）`,
    `西元 ${r.ys}/${r.ms}/${r.ds}｜農曆 民國${inp.lroc}年${inp.leap?"閏":""}${inp.lm}月${inp.ld}日｜${hourTxt}`,
    `三者之合 ${r.chain.join("/")}｜生命密碼 ${r.code}`,
    `人生功課 ${r.lesson}｜影響最大的數 ${r.influence}｜別人眼中的你 ${r.influence}｜補數 ${r.missing.join("、")||"無"}`,
    `九星五行 40歲以前 ${r.after[0].el}（${r.after[0].gua}）／40歲以後 ${r.after[r.after.length-1].el}（${r.after[r.after.length-1].gua}）｜加分顏色 ${r.boost.map(b=>b.colors).join("；")}`,
    `數字連線 ${r.lines.map(L=>L.k+L.name).join("、")||"無"}`,
    `九宮格 ${[1,2,3,4,5,6,7,8,9,0].map(n=>n+":"+r.score[n]).join(" ")}`,
    ...(flow||[]).map(o=>`${o.y}｜先天流年 ${o.f}${FLOW[o.f][0]}｜後天大運 ${o.ye.el}（${o.ye.gua}）${o.rel[1]}・${o.rel[3]}｜${o.verdict[0]}`),
    ...(current.months ? [`${current.months.y} 流月｜` + current.months.list.map(o=>`${o.m}月(${o.st.getMonth()+1}/${o.st.getDate()}起) ${o.pm}${MONTH_TXT[o.pm].k}（${o.verdict[0]}）`).join("　")] : [])
  ].join("\n");
}

function read(){
  const s = solarFromForm(); const sex = $("sexM").checked?"M":$("sexF").checked?"F":"";
  const errs = [];
  if (!$("name").value.trim()) errs.push("姓名");
  if (!sex) errs.push("生理性別");
  if (!s) errs.push("正確的西元出生年月日");
  if ($("hour").value==="") errs.push("出生時辰");
  if ($("hour").value==="ji" && !$("jiTime").value) errs.push("吉時的精確時間");
  const lroc = parseInt($("ly").value,10);
  if (isNaN(lroc)) errs.push("農曆出生年（民國）");
  if (errs.length){ $("err").textContent = "請填寫：" + errs.join("、") + "。"; return null; }
  const inp = {name:$("name").value.trim(),sex,...s,hour:$("hour").value,jiTime:$("jiTime").value,lroc,lm:+$("lm").value,ld:+$("ld").value,leap:$("leap").checked};
  const c = convert(s);
  $("err").textContent = (c && (c.roc!==inp.lroc||c.m!==inp.lm||c.d!==inp.ld||c.leap!==inp.leap))
    ? `提醒：農曆與西元換算結果（民國 ${c.roc} 年${c.leap?"閏":""}${LMON[c.m-1]}月${lunarDay(c.d)}）不一致，已依你填寫的農曆計算，請再確認。` : "";
  return inp;
}
$("f").addEventListener("submit", e => {
  e.preventDefault();
  if (typeof Solar==="undefined"){ $("err").textContent = "農曆換算元件載入失敗，請重新整理頁面。"; return; }
  const inp = read(); if (!inp) return;
  render(inp, compute(inp));
  $("out").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
});

/* ---------- 個案後台 (owner only, db) ---------- */
let db = null, adminReady = false, records = [], downloads = null;
function route(){
  const admin = location.hash==="#admin" && adminReady;
  $("viewCalc").style.display = admin ? "none" : "flex";
  $("viewAdmin").hidden = !admin; $("viewAdmin").style.display = admin ? "flex" : "none";
  $("navCalc").classList.toggle("on", !admin); $("navAdmin").classList.toggle("on", admin);
  document.title = admin ? "個案後台" : "後天五行靈數命盤";
  window.scrollTo(0,0);
}
function showTab(which){ if (which==="admin") location.hash = "admin"; else { if (location.hash) history.replaceState(null,"",location.pathname+location.search); route(); } }
window.addEventListener("hashchange", route);
$("navCalc").addEventListener("click", e => { e.preventDefault(); showTab("calc"); });
document.querySelector(".admin-hero .btn").addEventListener("click", e => { e.preventDefault(); showTab("calc"); });

async function initAdmin(){
  if (!window.claude?.use) return;
  try{
    const user = await claude.use("user");
    const allowed = user ? (await user.isOwner()) || (await user.canEdit()) : false;
    if (!allowed) return;
    db = await claude.use("db"); if (!db) return;
    adminReady = true; $("navAdmin").hidden = false; route();
    const sb = $("saveBtn"); if (sb) sb.hidden = false;
    db.collection("clients").orderBy("createdAt","desc").onSnapshot(snap => {
      records = snap.docs.map(d => ({id:d.id, ...d.data()}));
      drawRecords();
    }, e => { $("adminStatus").textContent = "無法讀取個案資料：" + e.message; $("adminStatus").className = "status bad"; });
    downloads = await claude.use("downloads");
    if (downloads) $("exportBtn").hidden = false;
  }catch(e){}
}
async function saveRecord(){
  if (!db || !current) return;
  const {inp,r} = current;
  const dup = records.find(x => x.name===inp.name && x.y===inp.y && x.m===inp.m && x.d===inp.d);
  if (editing) setEdit(false);
  const body = {...inp, analysisHtml: current.edited ? JSON.stringify(current.edited) : null, code:r.code, chain:r.chain.join("/"), elements:r.after.map(a=>a.el+"（"+a.gua+"）").join("、"),
    missing:r.missing.join("、"), lines:r.lines.map(L=>L.k).join(" "), updatedAt:new Date().toISOString()};
  status("儲存中…");
  try{
    if (dup) await db.collection("clients").doc(dup.id).update(body);
    else await db.collection("clients").add({...body, note:"", createdAt:new Date().toISOString()});
    status(dup ? "已更新個案資料" : "已存入個案後台");
  }catch(e){ status("儲存失敗：" + (e.message||e.code), true); }
}
const noteTimers = {};
const confirming = new Set();
function drawRecords(){
  const q = $("q").value.trim();
  const list = records.filter(x => !q || [x.name,`${x.y}/${x.m}/${x.d}`,x.note].join(" ").includes(q));
  $("recCount").textContent = `共 ${records.length} 位`;
  const ym = new Date().toISOString().slice(0,7);
  const thisMonth = records.filter(x => (x.createdAt||"").startsWith(ym)).length;
  const withNote = records.filter(x => (x.note||"").trim()).length;
  const codeCount = {}; records.forEach(x => { codeCount[x.code] = (codeCount[x.code]||0)+1; });
  const topCode = Object.entries(codeCount).sort((a,b)=>b[1]-a[1])[0];
  $("stats").innerHTML = `<div><span>個案總數</span><b>${records.length}</b></div><div><span>本月新增</span><b>${thisMonth}</b></div><div><span>已寫備註</span><b>${withNote}</b></div><div><span>最多的生命密碼</span><b>${topCode?topCode[0]:"–"}</b></div>`;
  if (!records.length){ $("recs").innerHTML = `<div class="empty">還沒有個案。到「排盤」頁排出命盤後，按「存入個案後台」。</div>`; return; }
  if (!list.length){ $("recs").innerHTML = `<div class="empty">找不到符合「${esc(q)}」的個案。</div>`; return; }
  $("recs").innerHTML = list.map(x => `
    <div class="rec" data-id="${x.id}">
      <div style="min-width:0">
        <div class="nm">${esc(x.name)} <span class="tag">${x.sex==="M"?"男":"女"}</span></div>
        <div class="facts"><span>西元 ${x.y}/${pad2(x.m)}/${pad2(x.d)}</span><span>農曆 民國${x.lroc}年${x.leap?"閏":""}${x.lm}月${x.ld}日</span><span>${x.hour==="ji"||x.hour==="jiu"?esc(hourLabel(x.hour,x.jiTime)):(HOURS[x.hour]?HOURS[x.hour][0]+"時":"")}</span></div>
        <div class="facts"><span>生命密碼 ${x.code}</span><span>三者之合 ${esc(x.chain)}</span><span>後天五行 ${esc(x.elements)}</span><span>補數 ${esc(x.missing)||"無"}</span></div>
        <textarea data-note="${x.id}" placeholder="備註：諮詢主題、聯絡方式、解盤重點">${esc(x.note)}</textarea>
        <div class="tiny">存入 ${x.createdAt?x.createdAt.slice(0,10):""}</div>
      </div>
      <div class="ops">
        <button class="btn line sm" data-open="${x.id}">開啟命盤</button>
        ${confirming.has(x.id)
          ? `<span class="confirm">確定刪除？<button class="btn line sm danger" data-delyes="${x.id}">刪除</button><button class="btn line sm" data-delno="${x.id}">取消</button></span>`
          : `<button class="btn line sm danger" data-del="${x.id}">刪除</button>`}
      </div>
    </div>`).join("");
}
$("q").addEventListener("input", drawRecords);
$("recs").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.open){ const x = records.find(r=>r.id===t.dataset.open); if(!x) return; setForm(x); showTab("calc"); const inp = read(); if(inp){ render(inp,compute(inp)); if (x.analysisHtml) applyEdited(x.analysisHtml); $("out").scrollIntoView({block:"start"}); } }
  if (t.dataset.del){ confirming.add(t.dataset.del); drawRecords(); }
  if (t.dataset.delno){ confirming.delete(t.dataset.delno); drawRecords(); }
  if (t.dataset.delyes){ const id = t.dataset.delyes; confirming.delete(id); try{ await db.collection("clients").doc(id).delete(); }catch(err){ $("adminStatus").textContent = "刪除失敗："+err.message; } }
});
$("recs").addEventListener("input", e => {
  const id = e.target.dataset?.note; if (!id) return;
  clearTimeout(noteTimers[id]);
  const val = e.target.value;
  noteTimers[id] = setTimeout(async () => {
    try{ await db.collection("clients").doc(id).update({note:val}); $("adminStatus").textContent = "備註已保存"; $("adminStatus").className="status"; }
    catch(err){ $("adminStatus").textContent = "備註保存失敗："+err.message; $("adminStatus").className="status bad"; }
  }, 900);
});
$("exportBtn").addEventListener("click", async () => {
  const head = ["姓名","性別","西元生日","出生時辰","農曆生日","三者之合","生命密碼","後天五行","補數","數字連線","備註","存入日期"];
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows = records.map(x => [x.name, x.sex==="M"?"男":"女", `${x.y}/${pad2(x.m)}/${pad2(x.d)}`, x.hour==="ji"||x.hour==="jiu"?hourLabel(x.hour,x.jiTime):(HOURS[x.hour]?HOURS[x.hour][0]+"時":""),
    `民國${x.lroc}年${x.leap?"閏":""}${x.lm}月${x.ld}日`, x.chain, x.code, x.elements, x.missing, x.lines, x.note, (x.createdAt||"").slice(0,10)].map(q).join(","));
  const csv = "﻿" + [head.map(q).join(","), ...rows].join("\r\n");
  try{ await downloads.save({filename:`個案資料_${new Date().toISOString().slice(0,10)}.csv`, data:new Blob([csv],{type:"text/csv"})}); }
  catch(e){ $("adminStatus").textContent = "匯出未完成"; $("adminStatus").className="status bad"; }
});

setTimeout(initAdmin, 0);
setTimeout(async()=>{ try{ if(!downloads && window.claude?.use) downloads = await claude.use("downloads"); }catch(e){} }, 0);
$("name").value = "王小花"; $("sexF").checked = true; $("sy").value = 1995; $("sm").value = 9; $("sd").value = 14; $("hour").value = 6;
if (typeof Solar!=="undefined"){ fillLunar(); lunarTouched = false; const inp = read(); if (inp) render(inp, compute(inp)); }
else $("out").innerHTML = '<p class="err">農曆換算元件載入失敗，請重新整理頁面。</p>';
})();
</script>
