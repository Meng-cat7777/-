<script>
(function(){
  var D={};
  try{D=JSON.parse(document.getElementById('svc-data').textContent)||{};}catch(e){D={};}
  function h(tag,attrs,kids){
    var el=document.createElement(tag);
    if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
      if(k==='text')el.textContent=v;else if(k==='cls')el.className=v;else el.setAttribute(k,v===true?'':v);}
    (kids||[]).forEach(function(c){if(c!=null)el.appendChild(typeof c==='string'?document.createTextNode(c):c);});
    return el;
  }
  function arr(x){return Array.isArray(x)?x:[];}
  function str(x){return x==null?'':String(x);}
  var lineId=str(D.line).trim()||'@556gtcjg';
  var LINE='https://line.me/R/ti/p/'+encodeURIComponent(lineId);
  [].forEach.call(document.querySelectorAll('a.contact'),function(a){a.href=LINE;});
  document.getElementById('foot-line').textContent='LINE '+lineId;
  var plans=arr(D.plans).filter(function(p){return p&&p.id&&p.show!==false;});
  var planIds={};plans.forEach(function(p){planIds[p.id]=p;});

  // 價目表
  var pc=document.getElementById('price-card');
  arr(D.groups).forEach(function(g){
    if(!g||g.show===false)return;
    pc.appendChild(h('h3',{text:str(g.title)}));
    if(g.pending){
      pc.appendChild(h('div',{cls:'pending'},[h('span',{cls:'soon',text:'籌備中'}),h('span',{text:str(g.pendingText)||'服務內容與價格即將公布，敬請期待'})]));
      return;
    }
    var isPend=arr(g.items).some(function(it){return it&&it.plan;});
    var ul=h('ul',{cls:'price'+(isPend?' pend':'')});
    arr(g.items).forEach(function(it){
      if(!it||it.show===false)return;
      var name=(it.plan&&planIds[it.plan])
        ?h('button',{type:'button',cls:'name plan-link','data-go':'pendulum','data-plan':'pl-'+it.plan,text:str(it.name)})
        :h('span',{cls:'name',text:str(it.name)});
      var p=it.price, has=(typeof p==='number'&&p>0);
      ul.appendChild(h('li',null,[name,str(it.note)?h('span',{cls:'note',text:str(it.note)}):null,h('span',{cls:'dots'}),
        h('span',{cls:'amt'+(has?'':' ask'),text:has?String(p):(str(it.priceText)||'價格洽詢')})]));
    });
    pc.appendChild(ul);
  });
  if(str(D.priceTip)){
    var tip=h('p',{cls:'tip'}), t=str(D.priceTip), re=/靈擺調頻方案|靈數解盤內容|占卜預約須知|靈數解盤須知/g, last=0, m;
    var map={'靈擺調頻方案':'pendulum','靈數解盤內容':'numerology','占卜預約須知':'tarot-rules','靈數解盤須知':'num-rules'};
    while((m=re.exec(t))){tip.appendChild(document.createTextNode(t.slice(last,m.index)));
      tip.appendChild(h('button',{type:'button',cls:'link','data-go':map[m[0]],text:m[0]}));last=m.index+m[0].length;}
    tip.appendChild(document.createTextNode(t.slice(last)));
    pc.appendChild(tip);
  }

  // 靈擺方案
  var chips=document.getElementById('chips'), box=document.getElementById('plans');
  plans.forEach(function(p){
    chips.appendChild(h('button',{type:'button','data-plan':'pl-'+p.id,text:str(p.title)}));
    var body=h('div',{cls:'plan-body'});
    arr(p.paras).forEach(function(x){if(str(x))body.appendChild(h('p',{text:str(x)}));});
    if(str(p.lead))body.appendChild(h('p',{cls:'lead',text:str(p.lead)}));
    var ul=h('ul',{cls:'ticks'});arr(p.items).forEach(function(x){if(str(x))ul.appendChild(h('li',{text:str(x)}));});
    body.appendChild(ul);
    box.appendChild(h('article',{cls:'card plan',id:'pl-'+p.id},[
      h('h3',{text:str(p.title)}),
      str(p.hook)?h('p',{cls:'hook',text:str(p.hook)}):null,
      body,
      str(p.close)?h('p',{cls:'close',text:str(p.close)}):null,
      h('a',{cls:'book',href:LINE,target:'_blank',rel:'noopener',text:'預約'+str(p.title)})
    ]));
  });
  var G=D.guide;
  if(G&&G.show!==false){
    var pick=h('ul',{cls:'pick'});
    arr(G.rows).forEach(function(r){if(!r||!str(r.text))return;var p=planIds[r.plan];
      pick.appendChild(h('li',null,[h('span',{text:str(r.text)}),p?h('button',{type:'button','data-plan':'pl-'+p.id,text:str(p.title)}):null]));});
    box.appendChild(h('div',{cls:'card guide',id:'pl-guide'},[
      h('h3',{text:str(G.title)||'不確定該選哪一個？'}),
      str(G.hook)?h('p',{cls:'hook',text:str(G.hook)}):null,
      pick,
      str(G.note)?h('p',{cls:'small-note',text:str(G.note)}):null,
      str(G.ask)?h('p',{cls:'center',text:str(G.ask)}):null,
      h('a',{cls:'book',href:LINE,target:'_blank',rel:'noopener',text:'預約／諮詢'}),
      str(G.close)?h('p',{cls:'close',text:str(G.close)}):null
    ]));
  }
  if(str(D.disclaimer))box.appendChild(h('p',{cls:'disclaimer',text:str(D.disclaimer)}));

  // 靈數解盤內容
  var nc=document.getElementById('num-card');
  arr(D.numerology).forEach(function(s){if(!s||s.show===false)return;
    nc.appendChild(h('h3',{text:str(s.title)}));
    var ol=h('ol');arr(s.items).forEach(function(x){if(str(x))ol.appendChild(h('li',{text:str(x)}));});nc.appendChild(ol);
    if(str(s.remark))nc.appendChild(h('p',{cls:'remark',text:str(s.remark)}));
  });

  // 預約須知
  function rules(el,R){R=R||{};
    el.appendChild(h('h3',{text:'預約流程'}));
    var ol=h('ol');arr(R.flow).forEach(function(x){if(str(x))ol.appendChild(h('li',{text:str(x)}));});el.appendChild(ol);
    el.appendChild(h('h3',{text:'付款方式'}));el.appendChild(h('p',{cls:'pay',text:str(R.pay)}));
    el.appendChild(h('h3',{text:'注意事項'}));
    var n=h('ol');arr(R.notes).forEach(function(x){if(str(x))n.appendChild(h('li',{text:str(x)}));});el.appendChild(n);
  }
  rules(document.getElementById('tarot-card'),D.tarotRules);
  rules(document.getElementById('numrules-card'),D.numRules);

  // 分頁切換
  var views=document.getElementById('views');
  var sections=[].slice.call(document.querySelectorAll('section.view'));
  var ids=sections.map(function(x){return x.id;});
  function go(id,plan){
    if(ids.indexOf(id)<0)id='price';
    sections.forEach(function(sec){sec.hidden=sec.id!==id;});
    [].forEach.call(views.querySelectorAll('button'),function(b){
      if(b.dataset.go===id){b.setAttribute('aria-current','page');var l=b.offsetLeft-views.offsetLeft,r=l+b.offsetWidth;if(l<views.scrollLeft+16||r>views.scrollLeft+views.clientWidth-16)views.scrollLeft=Math.max(0,l-16);}
      else b.removeAttribute('aria-current');
    });
    var t=plan&&document.getElementById(plan);
    if(t){t.scrollIntoView({behavior:'smooth',block:'start'});}else{window.scrollTo(0,0);}
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-go],[data-plan]'); if(!b)return;
    if(b.dataset.go){go(b.dataset.go,b.dataset.plan);}
    else{var t=document.getElementById(b.dataset.plan); if(t)t.scrollIntoView({behavior:'smooth',block:'start'});}
  });
  var hs=(location.hash||'').slice(1);
  if(hs.indexOf('pl-')===0)go('pendulum',hs);else go(hs||'price');
})();
</script>
